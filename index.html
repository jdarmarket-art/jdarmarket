<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدار | پلتفرم تخصصی گردشگری، زیارت و پزشکی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
        }

        .logo span {
            background: #7b5aff;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 20px;
            margin-left: 10px;
        }

        .nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav button {
            background: #f0f0f0;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav button:hover {
            background: #7b5aff;
            color: white;
        }

        .nav button.active {
            background: #2c3e50;
            color: white;
        }

        .page {
            display: none;
            animation: fade 0.3s;
        }

        .page.active {
            display: block;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
        }

        .search-box button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .category-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: #7b5aff;
            color: white;
            border-color: #7b5aff;
        }

        .subcategories {
            margin-bottom: 20px;
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .ad-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .ad-card:hover {
            transform: translateY(-5px);
        }

        .ad-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .ad-card-content {
            padding: 15px;
        }

        .ad-card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .ad-card-price {
            color: #7b5aff;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ad-card-meta {
            display: flex;
            gap: 10px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            outline: none;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        .btn {
            background: #7b5aff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: #2c3e50;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .image-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .image-preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .admin-table th, .admin-table td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: right;
        }

        .admin-table th {
            background: #f0f0f0;
        }

        .admin-actions button {
            margin: 2px;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .nav {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-bolt"></i> جدار
                <span>J-DAR</span>
            </div>
            <div class="nav">
                <button id="nav-home" class="active"><i class="fas fa-home"></i> خانه</button>
                <button id="nav-submit"><i class="fas fa-plus-circle"></i> ثبت آگهی</button>
                <button id="nav-admin"><i class="fas fa-cog"></i> مدیریت</button>
            </div>
        </div>

        <!-- صفحه اصلی -->
        <div id="page-home" class="page active">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="جستجو در آگهی‌ها...">
                <button id="search-btn"><i class="fas fa-search"></i> جستجو</button>
            </div>

            <div class="categories" id="main-categories"></div>
            <div class="subcategories" id="sub-categories"></div>

            <div class="ads-grid" id="ads-list"></div>
        </div>

        <!-- صفحه جزئیات آگهی (داخل همان صفحه با دیتیل) -->
        <div id="page-ad-detail" class="page">
            <button class="btn btn-secondary" id="back-to-home"><i class="fas fa-arrow-right"></i> بازگشت</button>
            <div id="ad-detail-content"></div>
        </div>

        <!-- صفحه ثبت آگهی -->
        <div id="page-submit" class="page">
            <h2><i class="fas fa-plus-circle"></i> ثبت آگهی جدید</h2>
            <form id="ad-form">
                <div class="form-group">
                    <label>عنوان آگهی</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>توضیحات</label>
                    <textarea id="description" required></textarea>
                </div>
                <div class="form-group">
                    <label>دسته اصلی</label>
                    <select id="main-category" required>
                        <option value="">انتخاب کنید</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>زیرمجموعه (اختیاری)</label>
                    <select id="sub-category">
                        <option value="">بدون زیرمجموعه</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>قیمت (اختیاری)</label>
                    <input type="text" id="price" placeholder="مثلاً ۵۰۰,۰۰۰ تومان">
                </div>
                <div class="form-group">
                    <label>واحد پول</label>
                    <select id="currency">
                        <option value="تومان">تومان</option>
                        <option value="دلار">دلار</option>
                        <option value="دینار">دینار</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>شماره تماس</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label>واتساپ (اختیاری)</label>
                    <input type="text" id="whatsapp">
                </div>
                <div class="form-group">
                    <label>تصاویر (حداکثر ۵)</label>
                    <input type="file" id="image-input" accept="image/*" multiple>
                    <div class="image-preview" id="image-preview"></div>
                </div>
                <button type="submit" class="btn"><i class="fas fa-save"></i> ثبت آگهی</button>
            </form>
        </div>

        <!-- صفحه مدیریت -->
        <div id="page-admin" class="page">
            <h2><i class="fas fa-cog"></i> پنل مدیریت</h2>
            <div id="admin-login">
                <div class="form-group">
                    <label>توکن ادمین</label>
                    <input type="password" id="admin-token" placeholder="توکن خود را وارد کنید">
                </div>
                <button class="btn" id="admin-login-btn"><i class="fas fa-sign-in-alt"></i> ورود</button>
            </div>
            <div id="admin-panel" style="display: none;">
                <div class="nav" style="margin-bottom: 20px;">
                    <button class="admin-tab active" data-tab="pending">در انتظار</button>
                    <button class="admin-tab" data-tab="prices">قیمت‌ها</button>
                    <button class="admin-tab" data-tab="feedback">بازخوردها</button>
                    <button class="admin-tab" data-tab="stats">آمار</button>
                </div>
                <div id="admin-pending" class="admin-tab-content active">
                    <h3>آگهی‌های در انتظار تأیید</h3>
                    <table class="admin-table" id="pending-table">
                        <thead>
                            <tr><th>شناسه</th><th>عنوان</th><th>شماره</th><th>عملیات</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="admin-prices" class="admin-tab-content">
                    <h3>تنظیمات قیمت</h3>
                    <div class="form-group">
                        <label>قیمت آگهی ویژه ۱ روزه</label>
                        <input type="number" id="price_special1">
                    </div>
                    <div class="form-group">
                        <label>قیمت آگهی ویژه ۳ روزه</label>
                        <input type="number" id="price_special3">
                    </div>
                    <div class="form-group">
                        <label>قیمت VIP 1 ماهه</label>
                        <input type="number" id="price_vip1">
                    </div>
                    <div class="form-group">
                        <label>قیمت VIP 3 ماهه</label>
                        <input type="number" id="price_vip3">
                    </div>
                    <div class="form-group">
                        <label>قیمت VIP 6 ماهه</label>
                        <input type="number" id="price_vip6">
                    </div>
                    <button class="btn" id="save-prices">ذخیره تغییرات</button>
                </div>
                <div id="admin-feedback" class="admin-tab-content">
                    <h3>بازخوردها</h3>
                    <table class="admin-table" id="feedback-table">
                        <thead><tr><th>نام</th><th>شماره</th><th>پیام</th><th>تاریخ</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="admin-stats" class="admin-tab-content">
                    <h3>آمار کلی</h3>
                    <div id="stats-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== تنظیمات ====================
        const API_URL = 'https://jdar-platform.your-subdomain.workers.dev'; // **حتماً این را با آدرس واقعی Worker خود جایگزین کنید**

        let categories = [];
        let currentMainCat = null;
        let currentSubCat = null;
        let allAds = [];
        let adminToken = localStorage.getItem('adminToken') || '';

        // عناصر
        const homePage = document.getElementById('page-home');
        const adDetailPage = document.getElementById('page-ad-detail');
        const submitPage = document.getElementById('page-submit');
        const adminPage = document.getElementById('page-admin');
        const navHome = document.getElementById('nav-home');
        const navSubmit = document.getElementById('nav-submit');
        const navAdmin = document.getElementById('nav-admin');
        const backToHome = document.getElementById('back-to-home');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const mainCategoriesDiv = document.getElementById('main-categories');
        const subCategoriesDiv = document.getElementById('sub-categories');
        const adsList = document.getElementById('ads-list');
        const adDetailContent = document.getElementById('ad-detail-content');

        // ==================== توابع کمکی ====================
        function showMessage(text, type = 'success', target = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.innerText = text;
            if (target) target.prepend(msgDiv);
            else document.querySelector('.container').prepend(msgDiv);
            setTimeout(() => msgDiv.remove(), 5000);
        }

        async function fetchAPI(endpoint, options = {}) {
            const url = `${API_URL}${endpoint}`;
            options.headers = options.headers || {};
            options.headers['Content-Type'] = 'application/json';
            const response = await fetch(url, options);
            return await response.json();
        }

        // ==================== بارگذاری دسته‌بندی‌ها ====================
        async function loadCategories() {
            try {
                const data = await fetchAPI('/api/categories');
                if (data.success) {
                    categories = data.categories;
                    renderMainCategories();
                }
            } catch (e) {
                console.error('خطا در بارگذاری دسته‌بندی‌ها', e);
            }
        }

        function renderMainCategories() {
            const mains = categories.filter(c => !c.parent_id);
            mainCategoriesDiv.innerHTML = mains.map(c => 
                `<span class="category-btn ${currentMainCat === c.id ? 'active' : ''}" data-id="${c.id}">${c.name_fa}</span>`
            ).join('');
            document.querySelectorAll('#main-categories .category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    currentMainCat = currentMainCat === id ? null : id;
                    currentSubCat = null;
                    renderMainCategories();
                    renderSubCategories();
                    loadAds();
                });
            });
            renderSubCategories();
        }

        function renderSubCategories() {
            if (!currentMainCat) {
                subCategoriesDiv.innerHTML = '';
                return;
            }
            const subs = categories.filter(c => c.parent_id === currentMainCat);
            let html = subs.map(c => 
                `<span class="category-btn ${currentSubCat === c.id ? 'active' : ''}" data-id="${c.id}">${c.name_fa}</span>`
            ).join('');
            if (subs.length > 0) {
                html = `<span class="category-btn ${currentSubCat === null ? 'active' : ''}" data-id="all">همه</span>` + html;
            }
            subCategoriesDiv.innerHTML = html;
            document.querySelectorAll('#sub-categories .category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id === 'all' ? null : parseInt(btn.dataset.id);
                    currentSubCat = id;
                    renderSubCategories();
                    loadAds();
                });
            });
        }

        // ==================== بارگذاری آگهی‌ها ====================
        async function loadAds() {
            let url = '/api/ads?';
            if (currentMainCat) url += `category=${currentMainCat}&`;
            if (currentSubCat) url += `subcategory=${currentSubCat}&`;
            const search = searchInput.value.trim();
            if (search) url += `search=${encodeURIComponent(search)}&`;
            try {
                const data = await fetchAPI(url);
                if (data.success) {
                    allAds = data.ads;
                    renderAds(allAds);
                }
            } catch (e) {
                console.error('خطا در بارگذاری آگهی‌ها', e);
            }
        }

        function renderAds(ads) {
            if (!ads.length) {
                adsList.innerHTML = '<p style="text-align:center; color:#777;">آگهی‌ای یافت نشد.</p>';
                return;
            }
            adsList.innerHTML = ads.map(ad => {
                let images = [];
                try { images = JSON.parse(ad.images || '[]'); } catch { images = []; }
                const imgUrl = images.length ? `${API_URL}/image/${images[0]}` : 'https://via.placeholder.com/300x200?text=J-DAR';
                return `
                    <div class="ad-card" data-id="${ad.id}">
                        <img src="${imgUrl}" alt="${ad.title}" onerror="this.src='https://via.placeholder.com/300x200?text=J-DAR'">
                        <div class="ad-card-content">
                            <div class="ad-card-title">${ad.title}</div>
                            <div class="ad-card-price">💰 ${ad.price || 'توافقی'} ${ad.currency}</div>
                            <div class="ad-card-meta">
                                <span><i class="fas fa-phone"></i> ${ad.phone}</span>
                                <span><i class="fas fa-eye"></i> ${ad.views || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            document.querySelectorAll('.ad-card').forEach(card => {
                card.addEventListener('click', () => showAdDetail(card.dataset.id));
            });
        }

        // ==================== نمایش جزئیات آگهی ====================
        async function showAdDetail(id) {
            try {
                const data = await fetchAPI(`/api/ads/${id}`);
                if (data.success) {
                    const ad = data.ad;
                    let images = [];
                    try { images = JSON.parse(ad.images || '[]'); } catch { images = []; }
                    const imagesHtml = images.map(img => 
                        `<img src="${API_URL}/image/${img}" style="max-width:300px; max-height:300px; margin:5px; border-radius:10px;">`
                    ).join('');
                    const date = new Date(ad.created_at * 1000).toLocaleDateString('fa-IR');
                    adDetailContent.innerHTML = `
                        <h2>${ad.title}</h2>
                        <p><strong>توضیحات:</strong> ${ad.description}</p>
                        <p><strong>قیمت:</strong> ${ad.price || 'توافقی'} ${ad.currency}</p>
                        <p><strong>شماره تماس:</strong> ${ad.phone} ${ad.whatsapp ? ' (واتساپ: ' + ad.whatsapp + ')' : ''}</p>
                        <p><strong>تاریخ ثبت:</strong> ${date}</p>
                        <p><strong>بازدید:</strong> ${ad.views || 0}</p>
                        <div><strong>تصاویر:</strong><br>${imagesHtml}</div>
                    `;
                    // ثبت بازدید
                    fetchAPI(`/api/view/${id}`, { method: 'POST' });
                    // نمایش صفحه جزئیات
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    adDetailPage.classList.add('active');
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ==================== ثبت آگهی ====================
        document.getElementById('ad-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const category_id = parseInt(document.getElementById('main-category').value);
            const subcategory_id = document.getElementById('sub-category').value ? parseInt(document.getElementById('sub-category').value) : undefined;
            const price = document.getElementById('price').value;
            const currency = document.getElementById('currency').value;
            const phone = document.getElementById('phone').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const images = window.uploadedFileIds || [];

            const data = { title, description, category_id, subcategory_id, price, currency, phone, whatsapp, images };
            try {
                const res = await fetchAPI('/api/ads', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                if (res.success) {
                    showMessage('آگهی با موفقیت ثبت شد و پس از تأیید نمایش داده می‌شود.', 'success');
                    document.getElementById('ad-form').reset();
                    window.uploadedFileIds = [];
                    document.getElementById('image-preview').innerHTML = '';
                    // برگشت به خانه
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    homePage.classList.add('active');
                    loadAds();
                } else {
                    showMessage('خطا در ثبت آگهی: ' + res.error, 'error');
                }
            } catch (e) {
                showMessage('خطا در ارتباط با سرور', 'error');
            }
        });

        // آپلود تصویر
        window.uploadedFileIds = [];
        document.getElementById('image-input').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length + window.uploadedFileIds.length > 5) {
                alert('حداکثر ۵ تصویر مجاز است');
                return;
            }
            for (let file of files) {
                const formData = new FormData();
                formData.append('file', file);
                try {
                    const res = await fetch(`${API_URL}/api/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.success) {
                        window.uploadedFileIds.push(data.fileId);
                        const preview = document.getElementById('image-preview');
                        const img = document.createElement('img');
                        img.src = `${API_URL}/image/${data.fileId}`;
                        preview.appendChild(img);
                    } else {
                        alert('خطا در آپلود تصویر: ' + data.error);
                    }
                } catch (e) {
                    alert('خطا در آپلود');
                }
            }
        });

        // ==================== مدیریت (ادمین) ====================
        document.getElementById('admin-login-btn').addEventListener('click', () => {
            const token = document.getElementById('admin-token').value;
            if (token) {
                adminToken = token;
                localStorage.setItem('adminToken', token);
                loadAdminPanel();
            }
        });

        async function loadAdminPanel() {
            if (!adminToken) return;
            document.getElementById('admin-login').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadPendingAds();
            loadPrices();
            loadFeedback();
            loadStats();
        }

        async function authFetch(url, options = {}) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = `Bearer ${adminToken}`;
            const response = await fetch(`${API_URL}${url}`, options);
            return await response.json();
        }

        async function loadPendingAds() {
            try {
                const data = await authFetch('/api/admin/pending');
                if (data.success) {
                    const tbody = document.querySelector('#pending-table tbody');
                    tbody.innerHTML = data.ads.map(ad => `
                        <tr>
                            <td>${ad.id}</td>
                            <td>${ad.title}</td>
                            <td>${ad.phone}</td>
                            <td class="admin-actions">
                                <button onclick="approveAd(${ad.id})" style="background:#28a745; color:white;">✅ تأیید</button>
                                <button onclick="rejectAd(${ad.id})" style="background:#dc3545; color:white;">❌ رد</button>
                                <button onclick="viewAd(${ad.id})" style="background:#17a2b8; color:white;">👁 مشاهده</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        window.approveAd = async (id) => {
            await authFetch(`/api/admin/approve/${id}`, { method: 'POST' });
            loadPendingAds();
        };
        window.rejectAd = async (id) => {
            await authFetch(`/api/admin/reject/${id}`, { method: 'DELETE' });
            loadPendingAds();
        };
        window.viewAd = (id) => {
            showAdDetail(id);
        };

        async function loadPrices() {
            try {
                const data = await authFetch('/api/admin/prices');
                if (data.success) {
                    document.getElementById('price_special1').value = data.prices.price_special1 || '';
                    document.getElementById('price_special3').value = data.prices.price_special3 || '';
                    document.getElementById('price_vip1').value = data.prices.price_vip1 || '';
                    document.getElementById('price_vip3').value = data.prices.price_vip3 || '';
                    document.getElementById('price_vip6').value = data.prices.price_vip6 || '';
                }
            } catch (e) { console.error(e); }
        }

        document.getElementById('save-prices').addEventListener('click', async () => {
            const updates = {
                price_special1: document.getElementById('price_special1').value,
                price_special3: document.getElementById('price_special3').value,
                price_vip1: document.getElementById('price_vip1').value,
                price_vip3: document.getElementById('price_vip3').value,
                price_vip6: document.getElementById('price_vip6').value
            };
            await authFetch('/api/admin/prices', { method: 'PUT', body: JSON.stringify(updates) });
            showMessage('قیمت‌ها با موفقیت به‌روز شدند.', 'success');
        });

        async function loadFeedback() {
            try {
                const data = await authFetch('/api/admin/feedback');
                if (data.success) {
                    const tbody = document.querySelector('#feedback-table tbody');
                    tbody.innerHTML = data.feedbacks.map(f => `
                        <tr>
                            <td>${f.name || 'ناشناس'}</td>
                            <td>${f.phone || '—'}</td>
                            <td>${f.message}</td>
                            <td>${new Date(f.created_at*1000).toLocaleDateString('fa-IR')}</td>
                        </tr>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function loadStats() {
            try {
                const data = await authFetch('/api/admin/stats');
                if (data.success) {
                    document.getElementById('stats-content').innerHTML = `
                        <p>کل آگهی‌ها: ${data.totalAds}</p>
                        <p>تأیید شده: ${data.approvedAds}</p>
                        <p>در انتظار: ${data.pendingAds}</p>
                        <p>ویژه: ${data.specialAds}</p>
                        <p>بازدید کل: ${data.totalViews}</p>
                        <p>بازدید امروز: ${data.todayViews}</p>
                        <p>تعداد بازخوردها: ${data.feedbackCount}</p>
                    `;
                }
            } catch (e) { console.error(e); }
        }

        // ==================== ناوبری ====================
        navHome.addEventListener('click', () => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            homePage.classList.add('active');
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            navHome.classList.add('active');
            loadAds();
        });
        navSubmit.addEventListener('click', () => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            submitPage.classList.add('active');
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            navSubmit.classList.add('active');
            // بارگذاری دسته‌بندی‌ها در dropdown
            const mainSelect = document.getElementById('main-category');
            mainSelect.innerHTML = '<option value="">انتخاب کنید</option>' + 
                categories.filter(c => !c.parent_id).map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
            document.getElementById('main-category').addEventListener('change', function() {
                const catId = parseInt(this.value);
                const subSelect = document.getElementById('sub-category');
                if (!catId) {
                    subSelect.innerHTML = '<option value="">بدون زیرمجموعه</option>';
                    return;
                }
                const subs = categories.filter(c => c.parent_id === catId);
                subSelect.innerHTML = '<option value="">بدون زیرمجموعه</option>' + 
                    subs.map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
            });
        });
        navAdmin.addEventListener('click', () => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            adminPage.classList.add('active');
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            navAdmin.classList.add('active');
            if (adminToken) loadAdminPanel();
        });

        backToHome.addEventListener('click', () => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            homePage.classList.add('active');
        });

        searchBtn.addEventListener('click', loadAds);
        searchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') loadAds(); });

        // تب‌های مدیریت
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(`admin-${tab.dataset.tab}`).classList.add('active');
            });
        });

        // ==================== شروع ====================
        loadCategories();
        loadAds();
        if (adminToken) {
            document.getElementById('admin-login').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadAdminPanel();
        }
    </script>
</body>
  </html>
