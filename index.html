<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدار | نمایش fileId تصاویر</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazir', 'Tahoma', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: rgba(20,20,35,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; max-width: 480px; margin: 0 auto; }
        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .lang-buttons { display: flex; gap: 0.5rem; }
        .lang-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 0.3rem 0.8rem; border-radius: 2rem; cursor: pointer; font-size: 0.9rem; }
        .lang-btn:hover { background: #a78bfa; border-color: #a78bfa; }
        .bottom-nav { background: rgba(20,20,35,0.9); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; padding: 0.5rem 0; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; max-width: 480px; margin: 0 auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #aaa; cursor: pointer; transition: 0.2s; font-size: 0.8rem; gap: 0.2rem; flex: 1; padding: 0.5rem 0; }
        .nav-item i { font-size: 1.4rem; }
        .nav-item.active { color: #a78bfa; }
        .main-content { flex: 1; margin-top: 70px; margin-bottom: 80px; overflow-y: auto; padding: 1rem; max-width: 480px; margin-left: auto; margin-right: auto; width: 100%; }
        .page { display: none; animation: fade 0.3s; }
        .page.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .search-section { background: rgba(255,255,255,0.03); border-radius: 2rem; padding: 1.2rem; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 1.5rem; }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .search-box input { flex: 1; padding: 0.8rem 1.2rem; border-radius: 2rem; border: none; background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; border: 1px solid rgba(255,255,255,0.1); }
        .search-box input::placeholder { color: #aaa; }
        .search-box button { padding: 0.8rem 1.5rem; border-radius: 2rem; border: none; background: linear-gradient(135deg, #a78bfa, #7c3aed); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .categories { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .category-chip { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 0.4rem 1.2rem; border-radius: 2rem; cursor: pointer; transition: 0.2s; color: #ddd; font-size: 0.9rem; }
        .category-chip:hover, .category-chip.active { background: #a78bfa; color: white; }
        .subcategories { margin-top: 0.8rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .ads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        .ad-card { background: rgba(20,20,35,0.7); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem; overflow: hidden; transition: 0.2s; cursor: pointer; backdrop-filter: blur(10px); position: relative; }
        .ad-card:hover { transform: translateY(-5px); box-shadow: 0 15px 25px -10px rgba(167,139,250,0.3); }
        .ad-card-image { width: 100%; height: 140px; object-fit: cover; background: #1a1a2e; }
        .ad-card-content { padding: 0.8rem; }
        .ad-card-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ad-card-price { color: #a78bfa; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.2rem; }
        .ad-card-meta { display: flex; justify-content: space-between; color: #aaa; font-size: 0.7rem; }
        .favorite-btn { position: absolute; top: 0.5rem; left: 0.5rem; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); border-radius: 50%; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; border: 1px solid rgba(255,255,255,0.2); z-index: 2; }
        .favorite-btn.active { color: #ff5e7c; }
        .info-fileid { position: absolute; top: 0.5rem; right: 0.5rem; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); border-radius: 50%; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; border: 1px solid rgba(255,255,255,0.2); z-index: 2; font-size: 1rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 2000; padding: 1rem; overflow-y: auto; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { max-width: 450px; background: #1e1e2f; border-radius: 2rem; padding: 1.5rem; position: relative; width: 100%; margin: auto; }
        .close-modal { position: absolute; top: 1rem; left: 1rem; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .fileid-display { background: rgba(0,0,0,0.3); border-radius: 1rem; padding: 1rem; margin: 1rem 0; word-break: break-all; }
        .fileid-display span { color: #a78bfa; display: block; margin-bottom: 0.5rem; }
        .copy-btn { background: #a78bfa; border: none; color: white; padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; }
    </style>
</head>
<body>
    <!-- هدر -->
    <header class="header">
        <div class="logo">جدار</div>
        <div class="lang-buttons">
            <button class="lang-btn" id="lang-fa">FA</button>
            <button class="lang-btn" id="lang-ar">AR</button>
            <button class="lang-btn" id="lang-en">EN</button>
        </div>
    </header>

    <main class="main-content">
        <div id="home-page" class="page active">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="جستجو...">
                    <button id="search-btn"><i class="fas fa-search"></i> جستجو</button>
                </div>
                <div class="categories" id="main-categories"></div>
                <div class="subcategories" id="sub-categories"></div>
            </div>
            <div class="ads-grid" id="ads-list"></div>
        </div>
    </main>

    <!-- مودال نمایش fileId -->
    <div class="modal" id="fileid-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-fileid-modal">&times;</button>
            <h2>شناسه فایل تصویر</h2>
            <div id="fileid-content" class="fileid-display"></div>
            <button class="copy-btn" id="copy-fileid">کپی</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>خانه</span></div>
        <div class="nav-item" data-page="submit"><i class="fas fa-plus-circle"></i><span>ثبت</span></div>
        <div class="nav-item" data-page="favorites"><i class="fas fa-heart"></i><span>علاقه‌مندی</span></div>
        <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>پروفایل</span></div>
    </nav>

    <script>
        const API_URL = 'https://j-dar-market.j-dar-market.workers.dev';
        let categories = [];
        let currentMainCat = null;
        let currentSubCat = null;
        let allAds = [];

        // بارگذاری دسته‌بندی‌ها
        async function loadCategories() {
            try {
                const res = await fetch(`${API_URL}/api/categories`);
                const data = await res.json();
                if (data.success) categories = data.categories;
                renderMainCategories();
            } catch (e) { console.error(e); }
        }

        function renderMainCategories() {
            const mains = categories.filter(c => !c.parent_id);
            let html = mains.map(c => `<span class="category-chip" data-id="${c.id}">${c.name_fa}</span>`).join('');
            document.getElementById('main-categories').innerHTML = html;
            document.querySelectorAll('#main-categories .category-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    currentMainCat = currentMainCat === id ? null : id;
                    renderMainCategories();
                    renderSubCategories();
                    loadAds();
                });
            });
            renderSubCategories();
        }

        function renderSubCategories() {
            if (!currentMainCat) { document.getElementById('sub-categories').innerHTML = ''; return; }
            const subs = categories.filter(c => c.parent_id === currentMainCat);
            let html = `<span class="category-chip" data-id="all">همه</span>`;
            html += subs.map(c => `<span class="category-chip" data-id="${c.id}">${c.name_fa}</span>`).join('');
            document.getElementById('sub-categories').innerHTML = html;
            document.querySelectorAll('#sub-categories .category-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id === 'all' ? null : parseInt(btn.dataset.id);
                    currentSubCat = id;
                    renderSubCategories();
                    loadAds();
                });
            });
        }

        async function loadAds() {
            let url = '/api/ads?';
            if (currentMainCat) url += `category=${currentMainCat}&`;
            if (currentSubCat) url += `subcategory=${currentSubCat}&`;
            try {
                const res = await fetch(API_URL + url);
                const data = await res.json();
                if (data.success) { allAds = data.ads; renderAds(allAds); }
            } catch (e) { console.error(e); }
        }

        function getImageUrl(imageData) {
            if (!imageData) return null;
            try {
                const ids = typeof imageData === 'string' ? JSON.parse(imageData) : imageData;
                if (Array.isArray(ids) && ids.length > 0) return { url: `${API_URL}/image/${ids[0]}`, fileId: ids[0] };
                if (typeof imageData === 'string' && imageData.length > 10) return { url: `${API_URL}/image/${imageData}`, fileId: imageData };
            } catch (e) { console.error(e); }
            return null;
        }

        function renderAds(ads) {
            const container = document.getElementById('ads-list');
            if (!ads.length) { container.innerHTML = '<p style="color:#aaa;">آگهی‌ای یافت نشد</p>'; return; }
            container.innerHTML = ads.map(ad => {
                const imgInfo = getImageUrl(ad.images);
                const imgUrl = imgInfo ? imgInfo.url : 'https://via.placeholder.com/300x200?text=جدار';
                const fileId = imgInfo ? imgInfo.fileId : null;
                return `
                    <div class="ad-card" data-id="${ad.id}">
                        <img src="${imgUrl}" class="ad-card-image" onerror="this.src='https://via.placeholder.com/300x200?text=جدار';">
                        <div class="ad-card-content">
                            <div class="ad-card-title">${ad.title}</div>
                            <div class="ad-card-price">💰 ${ad.price || 'توافقی'}</div>
                        </div>
                        ${fileId ? `<div class="info-fileid" onclick="event.stopPropagation(); showFileId('${fileId}')">🔍</div>` : ''}
                    </div>
                `;
            }).join('');
            document.querySelectorAll('.ad-card').forEach(card => {
                card.addEventListener('click', () => alert('جزئیات آگهی (برای نمایش می‌توانید expand کنید)'));
            });
        }

        window.showFileId = (fileId) => {
            document.getElementById('fileid-content').innerHTML = `<span>شناسه فایل:</span> ${fileId}`;
            document.getElementById('fileid-modal').classList.add('active');
            document.getElementById('copy-fileid').onclick = () => {
                navigator.clipboard.writeText(fileId).then(() => alert('کپی شد!'));
            };
        };

        document.getElementById('close-fileid-modal').addEventListener('click', () => {
            document.getElementById('fileid-modal').classList.remove('active');
        });

        // زبان (ساده‌شده)
        function setLang(lang) { document.documentElement.lang = lang; document.documentElement.dir = (lang === 'fa'||lang==='ar')?'rtl':'ltr'; }
        document.getElementById('lang-fa').addEventListener('click', () => setLang('fa'));
        document.getElementById('lang-ar').addEventListener('click', () => setLang('ar'));
        document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

        // شروع
        loadCategories();
        loadAds();
    </script>
</body>
</html>
