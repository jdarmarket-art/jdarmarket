<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>جدار | بازارچه تخصصی گردشگری، زیارت و پزشکی</title>
    <!-- فونت وزیر از CDN -->
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <!-- فونت awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #0c0c1a 0%, #1e1e30 100%);
            color: #fff;
            line-height: 1.7;
            min-height: 100vh;
        }

        /* هدر شیشه‌ای ثابت */
        .header {
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.7rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c7b9ff, #fbc1d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 5px rgba(167, 139, 250, 0.3);
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-links a, .lang-btn {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: 3rem;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a:hover, .lang-btn:hover {
            background: rgba(167, 139, 250, 0.2);
            border-color: #a78bfa;
            color: #e2d9ff;
            transform: translateY(-2px);
        }

        .lang-btn i {
            font-size: 1.1rem;
        }

        /* هامبورگر برای موبایل */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 14px;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hamburger span {
            width: 26px;
            height: 3px;
            background: #fff;
            margin: 3px 0;
            transition: 0.3s;
        }

        /* منوی موبایل */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 80px;
            left: 1rem;
            right: 1rem;
            background: rgba(18, 18, 28, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1rem;
            z-index: 999;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -10px black;
        }

        .mobile-menu a, .mobile-menu button {
            color: #fff;
            padding: 0.9rem 1.2rem;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: none;
            border: none;
            text-align: right;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 1rem;
        }

        .mobile-menu a:last-child, .mobile-menu button:last-child {
            border-bottom: none;
        }

        .mobile-menu a:hover, .mobile-menu button:hover {
            background: rgba(167, 139, 250, 0.2);
        }

        /* دکمه شناور واتساپ */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: #25d366;
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            z-index: 999;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .whatsapp-float:hover {
            transform: scale(1.15);
            background: #20b859;
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.6);
        }

        /* محتوای اصلی */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* بخش جستجو و دسته‌بندی */
        .search-section {
            background: rgba(20, 20, 35, 0.4);
            border-radius: 3rem;
            padding: 2rem;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-box input {
            flex: 1;
            padding: 1rem 1.8rem;
            border-radius: 3rem;
            border: none;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #a78bfa;
            background: rgba(0, 0, 0, 0.6);
        }

        .search-box input::placeholder {
            color: #aaa;
        }

        .search-box button {
            padding: 1rem 2.5rem;
            border-radius: 3rem;
            border: none;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(167, 139, 250, 0.4);
        }

        .categories, .subcategories {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .category-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.7rem 1.8rem;
            border-radius: 3rem;
            cursor: pointer;
            transition: 0.2s;
            color: #ddd;
            font-weight: 400;
            backdrop-filter: blur(5px);
        }

        .category-chip:hover, .category-chip.active {
            background: #a78bfa;
            color: white;
            border-color: #a78bfa;
            box-shadow: 0 5px 15px rgba(167, 139, 250, 0.4);
        }

        .subcategories {
            margin-top: 1.2rem;
        }

        /* کارت آگهی‌ها */
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .ad-card {
            background: rgba(20, 20, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2.5rem;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .ad-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 40px -10px rgba(167, 139, 250, 0.4);
            border-color: #a78bfa;
        }

        .ad-card-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ad-card-content {
            padding: 1.5rem;
        }

        .ad-card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: #fff;
        }

        .ad-card-price {
            color: #f0c0a0;
            font-weight: 700;
            margin-bottom: 0.7rem;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.2);
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 2rem;
        }

        .ad-card-meta {
            display: flex;
            justify-content: space-between;
            color: #bbb;
            font-size: 0.95rem;
        }

        /* مودال جزئیات آگهی */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            z-index: 2000;
            padding: 2rem;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 950px;
            width: 100%;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(30px);
            border-radius: 3rem;
            padding: 2.5rem;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 70px -10px black;
            animation: modalFadeIn 0.3s;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-modal {
            position: absolute;
            top: 1.5rem;
            left: 1.8rem;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            line-height: 1;
        }

        .close-modal:hover {
            background: rgba(255,80,80,0.3);
            transform: rotate(90deg);
            color: #ff8a8a;
        }

        .modal-detail {
            margin-top: 1rem;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }

        .modal-images {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 1rem 0;
            margin: 1.5rem 0;
            scrollbar-width: thin;
            scrollbar-color: #a78bfa #2a2a3e;
        }

        .modal-images::-webkit-scrollbar {
            height: 6px;
        }
        .modal-images::-webkit-scrollbar-track {
            background: #2a2a3e;
            border-radius: 10px;
        }
        .modal-images::-webkit-scrollbar-thumb {
            background: #a78bfa;
            border-radius: 10px;
        }

        .modal-images img {
            height: 220px;
            border-radius: 2rem;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            cursor: pointer;
        }
        .modal-images img:hover {
            transform: scale(1.02);
            border-color: #a78bfa;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            padding: 1.8rem;
            margin: 1.5rem 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ddd;
        }
        .info-item i {
            width: 30px;
            color: #a78bfa;
            font-size: 1.3rem;
        }
        .info-item span {
            font-weight: 500;
        }
        .info-item a {
            color: #a78bfa;
            text-decoration: none;
            border-bottom: 1px dashed #a78bfa;
        }
        .info-item a:hover {
            color: #d8b4fe;
        }

        .modal-description {
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            margin: 1.5rem 0;
            line-height: 1.9;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 1rem;
            border-radius: 3rem;
            border: none;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        .modal-actions .btn:hover {
            background: #a78bfa;
            border-color: #a78bfa;
            transform: translateY(-3px);
        }
        .btn-whatsapp {
            background: #25d366 !important;
            border-color: #25d366 !important;
        }
        .btn-whatsapp:hover {
            background: #20b859 !important;
        }

        /* فرم ثبت آگهی */
        .form-container {
            background: rgba(20, 20, 35, 0.6);
            border-radius: 3rem;
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: #b7a9ff;
            font-weight: 500;
            font-size: 1.1rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 3rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #a78bfa;
            background: rgba(0,0,0,0.5);
        }

        .image-preview {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .image-preview img {
            width: 90px;
            height: 90px;
            border-radius: 1.5rem;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .btn {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border: none;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.1rem;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(167, 139, 250, 0.4);
        }

        /* پنل مدیریت */
        .admin-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 3rem;
            padding: 2.5rem;
            margin-top: 2rem;
            backdrop-filter: blur(12px);
        }

        .admin-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: transparent;
            border: 1px solid #a78bfa;
            color: #a78bfa;
            padding: 0.7rem 2rem;
            border-radius: 3rem;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }
        .admin-tab.active {
            background: #a78bfa;
            color: white;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            overflow: hidden;
        }
        .admin-table th, .admin-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: right;
        }
        .admin-table th {
            background: rgba(167, 139, 250, 0.2);
            color: #d8b4fe;
        }
        .admin-table button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            margin: 0 3px;
        }
        .admin-table button:hover {
            background: #a78bfa;
        }

        /* responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .container {
                padding: 0 1rem;
            }
            .modal-content {
                padding: 1.8rem;
            }
            .modal-title {
                font-size: 1.6rem;
            }
            .modal-images img {
                height: 150px;
            }
            .whatsapp-float {
                width: 55px;
                height: 55px;
                font-size: 30px;
                bottom: 15px;
                left: 15px;
            }
        }

        /* انیمیشن صفحات */
        .page {
            animation: pageFade 0.4s;
        }
        @keyframes pageFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- هدر ثابت -->
    <div class="header">
        <div class="logo">J-DAR</div>
        <div class="nav-links">
            <a href="#" id="home-link"><i class="fas fa-home"></i> <span data-i18n="home">خانه</span></a>
            <a href="#" id="submit-link"><i class="fas fa-plus-circle"></i> <span data-i18n="post_ad">ثبت آگهی</span></a>
            <button class="lang-btn" id="lang-fa"><i class="fas fa-globe"></i> FA</button>
            <button class="lang-btn" id="lang-ar">AR</button>
            <button class="lang-btn" id="lang-en">EN</button>
            <button class="lang-btn" id="admin-toggle"><i class="fas fa-cog"></i></button>
        </div>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- منوی موبایل -->
    <div class="mobile-menu" id="mobile-menu">
        <a href="#" id="mobile-home"><i class="fas fa-home"></i> خانه</a>
        <a href="#" id="mobile-submit"><i class="fas fa-plus-circle"></i> ثبت آگهی</a>
        <button id="mobile-lang-fa"><i class="fas fa-globe"></i> فارسی</button>
        <button id="mobile-lang-ar"><i class="fas fa-globe"></i> العربية</button>
        <button id="mobile-lang-en"><i class="fas fa-globe"></i> English</button>
        <button id="mobile-admin"><i class="fas fa-cog"></i> مدیریت</button>
    </div>

    <!-- دکمه شناور واتساپ -->
    <a href="https://wa.me/989332356547" class="whatsapp-float" target="_blank" title="چت در واتساپ">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- محتوای اصلی -->
    <div class="container">
        <!-- صفحه اصلی -->
        <div id="home-page" class="page">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="جستجو در آگهی‌ها...">
                    <button id="search-btn"><i class="fas fa-search"></i> <span data-i18n="search">جستجو</span></button>
                </div>
                <div class="categories" id="main-categories"></div>
                <div class="subcategories" id="sub-categories"></div>
            </div>
            <div class="ads-grid" id="ads-list"></div>
        </div>

        <!-- صفحه ثبت آگهی -->
        <div id="submit-page" class="page" style="display: none;">
            <div class="form-container">
                <h2 style="margin-bottom: 2rem;"><i class="fas fa-plus-circle" style="color: #a78bfa;"></i> <span data-i18n="post_ad">ثبت آگهی جدید</span></h2>
                <form id="ad-form">
                    <div class="form-group">
                        <label data-i18n="enter_title">عنوان آگهی</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="enter_description">توضیحات</label>
                        <textarea id="description" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label data-i18n="select_category">دسته اصلی</label>
                        <select id="main-category" required>
                            <option value="">انتخاب کنید</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="select_subcategory">زیرمجموعه (اختیاری)</label>
                        <select id="sub-category">
                            <option value="">بدون زیرمجموعه</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="enter_price">قیمت (اختیاری)</label>
                        <input type="text" id="price" placeholder="مثلاً ۵۰۰,۰۰۰ تومان">
                    </div>
                    <div class="form-group">
                        <label data-i18n="select_currency">واحد پول</label>
                        <select id="currency">
                            <option value="تومان">تومان</option>
                            <option value="دلار">دلار</option>
                            <option value="دینار">دینار</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="enter_phone">شماره تماس</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label>واتساپ (اختیاری)</label>
                        <input type="text" id="whatsapp" placeholder="شماره واتساپ">
                    </div>
                    <div class="form-group">
                        <label data-i18n="enter_photos">تصاویر (حداکثر ۵)</label>
                        <input type="file" id="image-input" accept="image/*" multiple>
                        <div class="image-preview" id="image-preview"></div>
                    </div>
                    <button type="submit" class="btn"><i class="fas fa-save"></i> <span data-i18n="save">ثبت آگهی</span></button>
                </form>
            </div>
        </div>

        <!-- پنل مدیریت -->
        <div id="admin-panel" class="admin-panel" style="display: none;">
            <h2 style="margin-bottom: 2rem;"><i class="fas fa-cog" style="color: #a78bfa;"></i> <span data-i18n="admin">پنل مدیریت</span></h2>
            <div id="admin-login-section">
                <div class="form-group">
                    <label>توکن ادمین</label>
                    <input type="password" id="admin-token" placeholder="توکن خود را وارد کنید">
                </div>
                <button class="btn" id="admin-login"><i class="fas fa-sign-in-alt"></i> ورود</button>
            </div>
            <div id="admin-content" style="display: none;">
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="pending"><span data-i18n="pending_ads">در انتظار</span></button>
                    <button class="admin-tab" data-tab="prices"><span data-i18n="price_settings">قیمت‌ها</span></button>
                    <button class="admin-tab" data-tab="feedback"><span data-i18n="feedback">بازخوردها</span></button>
                    <button class="admin-tab" data-tab="stats"><span data-i18n="statistics">آمار</span></button>
                </div>
                <div class="admin-tab-content" id="admin-pending">
                    <table class="admin-table" id="pending-table">
                        <thead><tr><th>شناسه</th><th>عنوان</th><th>شماره</th><th>عملیات</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="admin-tab-content" id="admin-prices" style="display: none;">
                    <!-- inputs قیمت -->
                    <div class="form-group"><label>قیمت آگهی ویژه ۱ روزه</label><input type="number" id="price_special1"></div>
                    <div class="form-group"><label>قیمت آگهی ویژه ۳ روزه</label><input type="number" id="price_special3"></div>
                    <div class="form-group"><label>قیمت VIP 1 ماهه</label><input type="number" id="price_vip1"></div>
                    <div class="form-group"><label>قیمت VIP 3 ماهه</label><input type="number" id="price_vip3"></div>
                    <div class="form-group"><label>قیمت VIP 6 ماهه</label><input type="number" id="price_vip6"></div>
                    <button class="btn" id="save-prices">ذخیره</button>
                </div>
                <div class="admin-tab-content" id="admin-feedback" style="display: none;">
                    <table class="admin-table" id="feedback-table">
                        <thead><tr><th>نام</th><th>شماره</th><th>پیام</th><th>تاریخ</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="admin-tab-content" id="admin-stats" style="display: none;">
                    <div id="stats-content" style="background: rgba(0,0,0,0.2); border-radius: 2rem; padding: 2rem;"></div>
                </div>
            </div>
        </div>

        <!-- مودال جزئیات آگهی -->
        <div class="modal" id="ad-modal">
            <div class="modal-content">
                <button class="close-modal" id="close-modal">&times;</button>
                <div id="modal-detail" class="modal-detail"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== تنظیمات ====================
        const API_URL = 'https://j-dar-market.j-dar-market.workers.dev';
        let currentLang = localStorage.getItem('lang') || 'fa';
        let categories = [];
        let currentMainCat = null;
        let currentSubCat = null;
        let allAds = [];
        let adminToken = localStorage.getItem('adminToken') || '';
        let uploadedFileIds = [];

        // ترجمه‌ها
        const translations = {
            fa: { home:'خانه', post_ad:'ثبت آگهی', admin:'مدیریت', search:'جستجو', enter_title:'عنوان آگهی', enter_description:'توضیحات', select_category:'دسته اصلی', select_subcategory:'زیرمجموعه (اختیاری)', enter_price:'قیمت (اختیاری)', select_currency:'واحد پول', enter_phone:'شماره تماس', enter_photos:'تصاویر (حداکثر ۵)', save:'ثبت آگهی', pending_ads:'در انتظار', price_settings:'قیمت‌ها', feedback:'بازخوردها', statistics:'آمار', no_ads:'آگهی‌ای یافت نشد', approve:'تأیید', reject:'رد', view:'مشاهده' },
            ar: { home:'الرئيسية', post_ad:'إعلان', admin:'الإدارة', search:'بحث', enter_title:'العنوان', enter_description:'الوصف', select_category:'الفئة الرئيسية', select_subcategory:'الفئة الفرعية', enter_price:'السعر', select_currency:'العملة', enter_phone:'رقم الهاتف', enter_photos:'الصور', save:'حفظ', pending_ads:'قيد الانتظار', price_settings:'الأسعار', feedback:'الآراء', statistics:'الإحصائيات', no_ads:'لا توجد إعلانات', approve:'موافقة', reject:'رفض', view:'عرض' },
            en: { home:'Home', post_ad:'Post Ad', admin:'Admin', search:'Search', enter_title:'Title', enter_description:'Description', select_category:'Main Category', select_subcategory:'Subcategory', enter_price:'Price', select_currency:'Currency', enter_phone:'Phone', enter_photos:'Photos (max 5)', save:'Submit', pending_ads:'Pending', price_settings:'Prices', feedback:'Feedback', statistics:'Stats', no_ads:'No ads found', approve:'Approve', reject:'Reject', view:'View' }
        };

        function t(key) { return translations[currentLang]?.[key] || key; }
        function updateUILang() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = t(key);
            });
            document.documentElement.lang = currentLang;
            document.documentElement.dir = (currentLang === 'fa' || currentLang === 'ar') ? 'rtl' : 'ltr';
        }

        async function fetchAPI(endpoint, options = {}) {
            const url = `${API_URL}${endpoint}`;
            options.headers = options.headers || {};
            if (!(options.body instanceof FormData)) {
                options.headers['Content-Type'] = 'application/json';
            }
            const res = await fetch(url, options);
            return await res.json();
        }

        function showMessage(msg, type = 'success') { alert(msg); }

        // ==================== بارگذاری دسته‌بندی‌ها ====================
        async function loadCategories() {
            try {
                const data = await fetchAPI('/api/categories');
                if (data.success) {
                    categories = data.categories;
                    renderMainCategories();
                }
            } catch (e) { console.error(e); }
        }

        function renderMainCategories() {
            const mains = categories.filter(c => !c.parent_id);
            let html = mains.map(c => `<span class="category-chip ${currentMainCat === c.id ? 'active' : ''}" data-id="${c.id}">${c.name_fa}</span>`).join('');
            document.getElementById('main-categories').innerHTML = html;
            document.querySelectorAll('#main-categories .category-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    currentMainCat = currentMainCat === id ? null : id;
                    currentSubCat = null;
                    renderMainCategories();
                    renderSubCategories();
                    loadAds();
                });
            });
            renderSubCategories();
        }

        function renderSubCategories() {
            if (!currentMainCat) { document.getElementById('sub-categories').innerHTML = ''; return; }
            const subs = categories.filter(c => c.parent_id === currentMainCat);
            let html = `<span class="category-chip ${currentSubCat === null ? 'active' : ''}" data-id="all">همه</span>`;
            html += subs.map(c => `<span class="category-chip ${currentSubCat === c.id ? 'active' : ''}" data-id="${c.id}">${c.name_fa}</span>`).join('');
            document.getElementById('sub-categories').innerHTML = html;
            document.querySelectorAll('#sub-categories .category-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id === 'all' ? null : parseInt(btn.dataset.id);
                    currentSubCat = id;
                    renderSubCategories();
                    loadAds();
                });
            });
        }

        // ==================== بارگذاری آگهی‌ها ====================
        async function loadAds() {
            let url = '/api/ads?';
            if (currentMainCat) url += `category=${currentMainCat}&`;
            if (currentSubCat) url += `subcategory=${currentSubCat}&`;
            const search = document.getElementById('search-input').value.trim();
            if (search) url += `search=${encodeURIComponent(search)}&`;
            try {
                const data = await fetchAPI(url);
                if (data.success) {
                    allAds = data.ads;
                    renderAds(allAds);
                }
            } catch (e) { console.error(e); }
        }

        function renderAds(ads) {
            const container = document.getElementById('ads-list');
            if (!ads.length) {
                container.innerHTML = `<p style="text-align:center; color:#aaa;">${t('no_ads')}</p>`;
                return;
            }
            container.innerHTML = ads.map(ad => {
                let images = [];
                try { images = JSON.parse(ad.images || '[]'); } catch { images = []; }
                const imgUrl = images.length ? `${API_URL}/image/${images[0]}` : 'https://via.placeholder.com/400x250?text=J-DAR';
                return `
                    <div class="ad-card" data-id="${ad.id}">
                        <img src="${imgUrl}" class="ad-card-image" onerror="this.src='https://via.placeholder.com/400x250?text=J-DAR'">
                        <div class="ad-card-content">
                            <div class="ad-card-title">${ad.title}</div>
                            <div class="ad-card-price">💰 ${ad.price || 'توافقی'} ${ad.currency || ''}</div>
                            <div class="ad-card-meta">
                                <span><i class="fas fa-phone"></i> ${ad.phone}</span>
                                <span><i class="fas fa-eye"></i> ${ad.views || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            document.querySelectorAll('.ad-card').forEach(card => {
                card.addEventListener('click', () => showAdDetail(card.dataset.id));
            });
        }

        // ==================== نمایش جزئیات آگهی (بهبود یافته) ====================
        async function showAdDetail(id) {
            try {
                const data = await fetchAPI(`/api/ads/${id}`);
                if (data.success) {
                    const ad = data.ad;
                    let images = [];
                    try { images = JSON.parse(ad.images || '[]'); } catch { images = []; }
                    const imagesHtml = images.map(img => `<img src="${API_URL}/image/${img}" alt="ad image" onclick="window.open(this.src)">`).join('');
                    const date = new Date(ad.created_at * 1000).toLocaleDateString('fa-IR');
                    const whatsappNumber = ad.whatsapp ? ad.whatsapp.replace(/\D/g,'') : ad.phone.replace(/\D/g,'');
                    const modalHtml = `
                        <h2 class="modal-title">${ad.title}</h2>
                        <div class="modal-images">${imagesHtml || '<p style="color:#aaa;">بدون تصویر</p>'}</div>
                        <div class="modal-info-grid">
                            <div class="info-item"><i class="fas fa-tag"></i> <span>${ad.price || 'توافقی'} ${ad.currency || ''}</span></div>
                            <div class="info-item"><i class="fas fa-phone-alt"></i> <a href="tel:${ad.phone}">${ad.phone}</a></div>
                            ${ad.whatsapp ? `<div class="info-item"><i class="fab fa-whatsapp"></i> <a href="https://wa.me/${ad.whatsapp.replace(/\D/g,'')}" target="_blank">${ad.whatsapp}</a></div>` : ''}
                            <div class="info-item"><i class="fas fa-calendar-alt"></i> <span>${date}</span></div>
                            <div class="info-item"><i class="fas fa-eye"></i> <span>${ad.views || 0} بازدید</span></div>
                            <div class="info-item"><i class="fas fa-folder"></i> <span>${ad.category_name || ''}</span></div>
                        </div>
                        <div class="modal-description">
                            <strong>📄 توضیحات:</strong><br> ${ad.description}
                        </div>
                        <div class="modal-actions">
                            <a href="tel:${ad.phone}" class="btn"><i class="fas fa-phone"></i> تماس</a>
                            <a href="https://wa.me/${whatsappNumber}" target="_blank" class="btn btn-whatsapp"><i class="fab fa-whatsapp"></i> واتساپ</a>
                            <button class="btn" onclick="document.getElementById('ad-modal').classList.remove('active')"><i class="fas fa-times"></i> بستن</button>
                        </div>
                    `;
                    document.getElementById('modal-detail').innerHTML = modalHtml;
                    document.getElementById('ad-modal').classList.add('active');
                    fetchAPI(`/api/view/${id}`, { method: 'POST' }); // افزایش بازدید
                }
            } catch (e) { console.error(e); }
        }

        // ثبت آگهی
        document.getElementById('ad-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const category_id = parseInt(document.getElementById('main-category').value);
            const subcategory_id = document.getElementById('sub-category').value ? parseInt(document.getElementById('sub-category').value) : undefined;
            const price = document.getElementById('price').value;
            const currency = document.getElementById('currency').value;
            const phone = document.getElementById('phone').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const images = uploadedFileIds;
            const data = { title, description, category_id, subcategory_id, price, currency, phone, whatsapp, images };
            try {
                const res = await fetchAPI('/api/ads', { method:'POST', body: JSON.stringify(data) });
                if (res.success) {
                    showMessage('آگهی شما ثبت شد و پس از تأیید نمایش داده می‌شود.');
                    document.getElementById('ad-form').reset();
                    uploadedFileIds = [];
                    document.getElementById('image-preview').innerHTML = '';
                    document.getElementById('home-link').click();
                } else showMessage('خطا: ' + res.error, 'error');
            } catch { showMessage('خطا در ارتباط', 'error'); }
        });

        // آپلود تصویر
        document.getElementById('image-input').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length + uploadedFileIds.length > 5) { alert('حداکثر ۵ تصویر مجاز است'); return; }
            for (let file of files) {
                const formData = new FormData(); formData.append('file', file);
                try {
                    const res = await fetch(`${API_URL}/api/upload`, { method:'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        uploadedFileIds.push(data.fileId);
                        const preview = document.getElementById('image-preview');
                        const img = document.createElement('img'); img.src = `${API_URL}/image/${data.fileId}`;
                        preview.appendChild(img);
                    } else alert('خطا در آپلود: ' + data.error);
                } catch { alert('خطا در آپلود'); }
            }
        });

        // پنل مدیریت
        document.getElementById('admin-login').addEventListener('click', async () => {
            const token = document.getElementById('admin-token').value;
            if (token) {
                adminToken = token; localStorage.setItem('adminToken', token);
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminData();
            }
        });

        async function authFetch(url, options = {}) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = `Bearer ${adminToken}`;
            return fetchAPI(url, options);
        }

        async function loadAdminData() { if (!adminToken) return; loadPending(); loadPrices(); loadFeedback(); loadStats(); }
        async function loadPending() {
            const data = await authFetch('/api/admin/pending');
            if (data.success) {
                document.querySelector('#pending-table tbody').innerHTML = data.ads.map(ad => `
                    <tr><td>${ad.id}</td><td>${ad.title}</td><td>${ad.phone}</td>
                    <td><button onclick="approveAd(${ad.id})">✅ ${t('approve')}</button>
                        <button onclick="rejectAd(${ad.id})">❌ ${t('reject')}</button>
                        <button onclick="showAdDetail(${ad.id})">👁 ${t('view')}</button></td></tr>`).join('');
            }
        }
        window.approveAd = async (id) => { await authFetch(`/api/admin/approve/${id}`, { method:'POST' }); loadPending(); };
        window.rejectAd = async (id) => { await authFetch(`/api/admin/reject/${id}`, { method:'DELETE' }); loadPending(); };
        async function loadPrices() {
            const data = await authFetch('/api/admin/prices');
            if (data.success) {
                document.getElementById('price_special1').value = data.prices.price_special1 || '';
                document.getElementById('price_special3').value = data.prices.price_special3 || '';
                document.getElementById('price_vip1').value = data.prices.price_vip1 || '';
                document.getElementById('price_vip3').value = data.prices.price_vip3 || '';
                document.getElementById('price_vip6').value = data.prices.price_vip6 || '';
            }
        }
        document.getElementById('save-prices').addEventListener('click', async () => {
            const updates = {
                price_special1: document.getElementById('price_special1').value,
                price_special3: document.getElementById('price_special3').value,
                price_vip1: document.getElementById('price_vip1').value,
                price_vip3: document.getElementById('price_vip3').value,
                price_vip6: document.getElementById('price_vip6').value
            };
            await authFetch('/api/admin/prices', { method:'PUT', body: JSON.stringify(updates) });
            showMessage('قیمت‌ها به‌روز شدند');
        });
        async function loadFeedback() {
            const data = await authFetch('/api/admin/feedback');
            if (data.success) {
                document.querySelector('#feedback-table tbody').innerHTML = data.feedbacks.map(f => `
                    <tr><td>${f.name || '-'}</td><td>${f.phone || '-'}</td><td>${f.message}</td><td>${new Date(f.created_at*1000).toLocaleDateString()}</td></tr>`).join('');
            }
        }
        async function loadStats() {
            const data = await authFetch('/api/admin/stats');
            if (data.success) {
                document.getElementById('stats-content').innerHTML = `
                    <p>کل آگهی‌ها: ${data.totalAds}</p><p>تأیید شده: ${data.approvedAds}</p><p>در انتظار: ${data.pendingAds}</p>
                    <p>ویژه: ${data.specialAds}</p><p>بازدید کل: ${data.totalViews}</p><p>بازدید امروز: ${data.todayViews}</p><p>بازخوردها: ${data.feedbackCount}</p>`;
            }
        }

        // تب‌های مدیریت
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.admin-tab-content').forEach(c => c.style.display = 'none');
                document.getElementById(`admin-${tab.dataset.tab}`).style.display = 'block';
            });
        });

        // ناوبری
        document.getElementById('home-link').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('home-page').style.display = 'block';
            loadAds();
        });
        document.getElementById('submit-link').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('submit-page').style.display = 'block';
            const mainSelect = document.getElementById('main-category');
            mainSelect.innerHTML = '<option value="">انتخاب کنید</option>' + 
                categories.filter(c => !c.parent_id).map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
            mainSelect.onchange = function() {
                const id = parseInt(this.value);
                const subSelect = document.getElementById('sub-category');
                if (!id) { subSelect.innerHTML = '<option value="">بدون زیرمجموعه</option>'; return; }
                const subs = categories.filter(c => c.parent_id === id);
                subSelect.innerHTML = '<option value="">بدون زیرمجموعه</option>' + subs.map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
            };
        });
        document.getElementById('admin-toggle').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('admin-panel').style.display = 'block';
            if (adminToken) {
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminData();
            } else {
                document.getElementById('admin-login-section').style.display = 'block';
                document.getElementById('admin-content').style.display = 'none';
            }
        });
        document.getElementById('search-btn').addEventListener('click', loadAds);
        document.getElementById('search-input').addEventListener('keyup', (e) => { if (e.key === 'Enter') loadAds(); });

        // منوی موبایل
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobile-menu');
        hamburger.addEventListener('click', () => mobileMenu.classList.toggle('active'));
        document.getElementById('mobile-home').addEventListener('click', (e) => { e.preventDefault(); mobileMenu.classList.remove('active'); document.getElementById('home-link').click(); });
        document.getElementById('mobile-submit').addEventListener('click', (e) => { e.preventDefault(); mobileMenu.classList.remove('active'); document.getElementById('submit-link').click(); });
        document.getElementById('mobile-admin').addEventListener('click', () => { mobileMenu.classList.remove('active'); document.getElementById('admin-toggle').click(); });

        // تغییر زبان
        function setLang(lang) { currentLang = lang; localStorage.setItem('lang', lang); updateUILang(); loadAds(); }
        document.getElementById('lang-fa').addEventListener('click', () => setLang('fa'));
        document.getElementById('lang-ar').addEventListener('click', () => setLang('ar'));
        document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
        document.getElementById('mobile-lang-fa').addEventListener('click', () => { setLang('fa'); mobileMenu.classList.remove('active'); });
        document.getElementById('mobile-lang-ar').addEventListener('click', () => { setLang('ar'); mobileMenu.classList.remove('active'); });
        document.getElementById('mobile-lang-en').addEventListener('click', () => { setLang('en'); mobileMenu.classList.remove('active'); });

        // بستن مودال
        document.getElementById('close-modal').addEventListener('click', () => document.getElementById('ad-modal').classList.remove('active'));

        // شروع
        loadCategories();
        loadAds();
        updateUILang();
        if (adminToken) {
            document.getElementById('admin-login-section').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadAdminData();
        }
    </script>
</body>
    </html>
