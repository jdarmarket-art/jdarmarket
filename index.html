<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست تصویر جدار</title>
    <style>
        body {
            font-family: 'Vazir', sans-serif;
            background: #0f0f1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .container {
            background: rgba(20,20,35,0.7);
            border-radius: 2rem;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #a78bfa;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ddd;
        }
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        button {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border: none;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .image-container {
            text-align: center;
            min-height: 200px;
            background: rgba(0,0,0,0.2);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(255,255,255,0.2);
            padding: 1rem;
        }
        img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .error {
            color: #ff6b6b;
            margin-top: 0.5rem;
        }
        .info {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔍 تست تصویر Worker</h2>
        <label>شناسه فایل (fileId) را وارد کنید:</label>
        <input type="text" id="fileIdInput" placeholder="مثال: AgACAgQAAxkDAA...">
        <button id="loadBtn">نمایش تصویر</button>
        <div class="image-container" id="imageContainer">
            <span style="color:#aaa;">تصویری بارگذاری نشده است</span>
        </div>
        <div id="errorMsg" class="error"></div>
        <div class="info">
            <p>اگر تصویر نمایش داده نشد، احتمال دارد:</p>
            <ul>
                <li>شناسه فایل اشتباه باشد</li>
                <li>ربات به کانال دسترسی نداشته باشد</li>
                <li>فایل در تلگرام حذف شده باشد</li>
            </ul>
        </div>
    </div>

    <script>
        const API_URL = 'https://j-dar-market.j-dar-market.workers.dev';
        const loadBtn = document.getElementById('loadBtn');
        const fileIdInput = document.getElementById('fileIdInput');
        const imageContainer = document.getElementById('imageContainer');
        const errorMsg = document.getElementById('errorMsg');

        loadBtn.addEventListener('click', () => {
            const fileId = fileIdInput.value.trim();
            if (!fileId) {
                errorMsg.innerText = 'لطفاً یک شناسه فایل وارد کنید.';
                return;
            }
            const imgUrl = `${API_URL}/image/${fileId}`;
            // نمایش تصویر
            const img = new Image();
            img.onload = () => {
                imageContainer.innerHTML = '';
                imageContainer.appendChild(img);
                errorMsg.innerText = '';
            };
            img.onerror = () => {
                imageContainer.innerHTML = '<span style="color:#aaa;">❌ خطا در بارگذاری تصویر</span>';
                errorMsg.innerText = 'تصویر پیدا نشد یا Worker در دسترس نیست.';
            };
            img.src = imgUrl;
            imageContainer.innerHTML = '<span style="color:#aaa;">در حال بارگذاری...</span>';
        });

        // تست با یک نمونه (در صورت وجود)
        // می‌توانید یک fileId واقعی از آگهی‌های خود در اینجا قرار دهید
    </script>
</body>
</html>
