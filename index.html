<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بررسی تصاویر جدار</title>
    <style>
        body {
            font-family: 'Vazir', sans-serif;
            background: #0f0f1a;
            color: #fff;
            padding: 1rem;
            margin: 0;
        }
        .card {
            background: rgba(20,20,35,0.7);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .title {
            color: #a78bfa;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .images {
            background: rgba(0,0,0,0.3);
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin-top: 0.5rem;
            word-break: break-all;
            color: #aaa;
            font-size: 0.9rem;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #69db7e;
        }
        hr {
            border: 1px solid rgba(255,255,255,0.1);
            margin: 1rem 0;
        }
        button {
            background: #a78bfa;
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            margin: 0.5rem 0;
        }
        input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 0.5rem;
            border-radius: 2rem;
            width: 100%;
            margin: 0.5rem 0;
        }
        .fileid-test {
            background: #2a2a3a;
            border-radius: 1rem;
            padding: 1rem;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <h2>📋 بررسی فیلد images آگهی‌ها</h2>
    <button id="refreshBtn">🔄 بروزرسانی</button>
    <div id="ads-container"></div>

    <hr>
    <h2>🧪 تست مستقیم آپلود و دریافت fileId</h2>
    <div class="fileid-test">
        <label>یک تصویر انتخاب کنید (حداکثر ۵ مگابایت)</label>
        <input type="file" id="testImage" accept="image/*">
        <button id="uploadTest">📤 آپلود و دریافت fileId</button>
        <div id="uploadResult"></div>
    </div>

    <hr>
    <h2>🔍 تست نمایش تصویر با fileId</h2>
    <div class="fileid-test">
        <label>شناسه فایل (fileId) را وارد کنید</label>
        <input type="text" id="testFileId" placeholder="مثال: AgACAgQAAxkDAA...">
        <button id="testImageBtn">📥 نمایش تصویر</button>
        <div id="testImageResult" style="text-align: center; margin-top: 1rem;"></div>
    </div>

    <script>
        const API_URL = 'https://j-dar-market.j-dar-market.workers.dev';

        async function loadAds() {
            const container = document.getElementById('ads-container');
            container.innerHTML = 'در حال بارگذاری...';
            try {
                const res = await fetch(`${API_URL}/api/ads`);
                const data = await res.json();
                if (data.success && data.ads.length) {
                    container.innerHTML = data.ads.map(ad => {
                        const imagesRaw = ad.images || '[]';
                        let imagesParsed;
                        try {
                            imagesParsed = JSON.parse(imagesRaw);
                        } catch {
                            imagesParsed = imagesRaw; // اگر رشته ساده بود
                        }
                        const imagesStr = typeof imagesParsed === 'string' ? imagesParsed : JSON.stringify(imagesParsed, null, 2);
                        const hasImage = (Array.isArray(imagesParsed) && imagesParsed.length) || (typeof imagesParsed === 'string' && imagesParsed.length > 10);
                        return `
                            <div class="card">
                                <div class="title">${ad.title}</div>
                                <div>شناسه: ${ad.id}</div>
                                <div>شماره: ${ad.phone}</div>
                                <div class="images">
                                    <strong>فیلد images:</strong> ${imagesStr}
                                </div>
                                ${hasImage ? '<span class="success">✅ دارای تصویر</span>' : '<span class="error">❌ بدون تصویر</span>'}
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<p class="error">آگهی‌ای یافت نشد.</p>';
                }
            } catch (e) {
                container.innerHTML = `<p class="error">خطا در ارتباط: ${e.message}</p>`;
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadAds);

        // تست آپلود
        document.getElementById('uploadTest').addEventListener('click', async () => {
            const fileInput = document.getElementById('testImage');
            const file = fileInput.files[0];
            if (!file) {
                alert('لطفاً یک فایل انتخاب کنید.');
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.innerHTML = 'در حال آپلود...';
            try {
                const res = await fetch(`${API_URL}/api/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = `<span class="success">✅ آپلود موفق. fileId: ${data.fileId}</span>`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ خطا: ${data.error}</span>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<span class="error">❌ خطا: ${e.message}</span>`;
            }
        });

        // تست نمایش تصویر با fileId
        document.getElementById('testImageBtn').addEventListener('click', () => {
            const fileId = document.getElementById('testFileId').value.trim();
            if (!fileId) {
                alert('لطفاً fileId را وارد کنید.');
                return;
            }
            const imgUrl = `${API_URL}/image/${fileId}`;
            const resultDiv = document.getElementById('testImageResult');
            resultDiv.innerHTML = 'در حال بارگذاری...';
            const img = new Image();
            img.onload = () => {
                resultDiv.innerHTML = `<img src="${imgUrl}" style="max-width:100%; max-height:300px; border-radius:1rem;">`;
            };
            img.onerror = () => {
                resultDiv.innerHTML = '<span class="error">❌ خطا در بارگذاری تصویر. Worker ممکن است در دسترس نباشد یا fileId نامعتبر باشد.</span>';
            };
            img.src = imgUrl;
        });

        // بارگذاری اولیه
        loadAds();
    </script>
</body>
</html>
