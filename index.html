<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدار | J-DAR</title>
    <!-- فونت وزیر -->
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <!-- فونت‌آیکون -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', 'Tahoma', sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* هدر ثابت */
        .header {
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 480px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .lang-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .lang-btn:hover {
            background: #a78bfa;
            border-color: #a78bfa;
        }

        /* نوار پایین ثابت */
        .bottom-nav {
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0.5rem 0;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            max-width: 480px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            gap: 0.2rem;
            flex: 1;
            padding: 0.5rem 0;
        }

        .nav-item i {
            font-size: 1.4rem;
        }

        .nav-item.active {
            color: #a78bfa;
        }

        /* محتوای اصلی */
        .main-content {
            flex: 1;
            margin-top: 70px;
            margin-bottom: 80px;
            overflow-y: auto;
            padding: 1rem;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        /* صفحات */
        .page {
            display: none;
            animation: fade 0.3s;
        }

        .page.active {
            display: block;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* بخش جستجو */
        .search-section {
            background: rgba(255,255,255,0.03);
            border-radius: 2rem;
            padding: 1.2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 1.5rem;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .search-box input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            border: none;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-box input::placeholder {
            color: #aaa;
        }

        .search-box button {
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            border: none;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            transform: scale(1.05);
        }

        .categories {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .category-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.2s;
            color: #ddd;
            font-size: 0.9rem;
        }

        .category-chip:hover, .category-chip.active {
            background: #a78bfa;
            color: white;
        }

        .subcategories {
            margin-top: 0.8rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* کارت آگهی‌ها */
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }

        .ad-card {
            background: rgba(20,20,35,0.7);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            overflow: hidden;
            transition: 0.2s;
            cursor: pointer;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .ad-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px -10px rgba(167,139,250,0.3);
        }

        .ad-card-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #1a1a2e;
        }

        .ad-card-content {
            padding: 0.8rem;
        }

        .ad-card-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .ad-card-price {
            color: #a78bfa;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        .ad-card-meta {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 0.7rem;
        }

        .favorite-btn {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 2;
        }

        .favorite-btn.active {
            color: #ff5e7c;
        }

        /* مودال جزئیات آگهی */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            z-index: 2000;
            padding: 1rem;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 450px;
            background: #1e1e2f;
            border-radius: 2rem;
            padding: 1.5rem;
            position: relative;
            width: 100%;
            margin: auto;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        .modal-images {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
            padding-bottom: 0.5rem;
        }

        .modal-images img {
            height: 150px;
            border-radius: 1rem;
            object-fit: cover;
        }

        /* فرم ثبت آگهی */
        .form-container {
            background: rgba(20,20,35,0.7);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            color: #a78bfa;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: 'Vazir', sans-serif;
        }

        .image-preview {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .image-preview img {
            width: 60px;
            height: 60px;
            border-radius: 0.8rem;
            object-fit: cover;
        }

        .btn {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border: none;
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        /* پنل مدیریت */
        .admin-panel {
            background: rgba(20,20,35,0.7);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .admin-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: transparent;
            border: 1px solid #a78bfa;
            color: #a78bfa;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .admin-tab.active {
            background: #a78bfa;
            color: white;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .admin-table th, .admin-table td {
            padding: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: right;
        }

        .admin-table button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.7rem;
        }

        /* پروفایل */
        .profile-card {
            background: rgba(20,20,35,0.7);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .profile-avatar {
            font-size: 4rem;
            color: #a78bfa;
            margin-bottom: 1rem;
        }

        .profile-field {
            background: rgba(0,0,0,0.2);
            border-radius: 1rem;
            padding: 0.8rem;
            margin: 1rem 0;
            display: flex;
            justify-content: space-between;
        }

        /* علاقه‌مندی‌ها */
        .favorites-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        /* سه‌زبانه */
        [lang="fa"] { direction: rtl; }
        [lang="ar"] { direction: rtl; }
        [lang="en"] { direction: ltr; }

        /* برای PWA */
        @media (display-mode: standalone) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <!-- هدر ثابت -->
    <header class="header">
        <div class="logo">جدار</div>
        <div class="lang-buttons">
            <button class="lang-btn" id="lang-fa" data-i18n="lang_fa">FA</button>
            <button class="lang-btn" id="lang-ar" data-i18n="lang_ar">AR</button>
            <button class="lang-btn" id="lang-en" data-i18n="lang_en">EN</button>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="main-content" id="mainContent">
        <!-- صفحه خانه -->
        <div id="home-page" class="page active">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="جستجو در آگهی‌ها...">
                    <button id="search-btn"><i class="fas fa-search"></i> <span data-i18n="search">جستجو</span></button>
                </div>
                <div class="categories" id="main-categories"></div>
                <div class="subcategories" id="sub-categories"></div>
            </div>
            <div class="ads-grid" id="ads-list"></div>
        </div>

        <!-- صفحه ثبت آگهی -->
        <div id="submit-page" class="page">
            <div class="form-container">
                <h2 style="margin-bottom:1rem;"><i class="fas fa-plus-circle"></i> <span data-i18n="post_ad">ثبت آگهی جدید</span></h2>
                <form id="ad-form">
                    <div class="form-group">
                        <label data-i18n="enter_title">عنوان آگهی</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="enter_description">توضیحات</label>
                        <textarea id="description" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label data-i18n="select_category">دسته اصلی</label>
                        <select id="main-category" required>
                            <option value="" data-i18n="select_option">انتخاب کنید</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="select_subcategory">زیرمجموعه (اختیاری)</label>
                        <select id="sub-category">
                            <option value="" data-i18n="no_subcategory">بدون زیرمجموعه</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="enter_price">قیمت (اختیاری)</label>
                        <input type="text" id="price" data-i18n-placeholder="price_placeholder" placeholder="مثلاً ۵۰۰,۰۰۰ تومان">
                    </div>
                    <div class="form-group">
                        <label data-i18n="select_currency">واحد پول</label>
                        <select id="currency">
                            <option value="تومان" data-i18n="toman">تومان</option>
                            <option value="دلار" data-i18n="dollar">دلار</option>
                            <option value="دینار" data-i18n="dinar">دینار</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="enter_phone">شماره تماس</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="whatsapp">واتساپ (اختیاری)</label>
                        <input type="text" id="whatsapp">
                    </div>
                    <div class="form-group">
                        <label data-i18n="enter_photos">تصاویر (حداکثر ۵)</label>
                        <input type="file" id="image-input" accept="image/*" multiple>
                        <div class="image-preview" id="image-preview"></div>
                    </div>
                    <button type="submit" class="btn"><i class="fas fa-save"></i> <span data-i18n="save">ثبت آگهی</span></button>
                </form>
            </div>
        </div>

        <!-- صفحه علاقه‌مندی‌ها -->
        <div id="favorites-page" class="page">
            <h2 style="margin-bottom:1rem;"><i class="fas fa-heart" style="color:#ff5e7c;"></i> <span data-i18n="favorites">علاقه‌مندی‌ها</span></h2>
            <div class="favorites-grid" id="favorites-list"></div>
        </div>

        <!-- صفحه پروفایل -->
        <div id="profile-page" class="page">
            <div class="profile-card">
                <div class="profile-avatar"><i class="fas fa-user-circle"></i></div>
                <div class="profile-field">
                    <span data-i18n="username">نام کاربری</span>
                    <span id="profile-username">guest</span>
                </div>
                <div class="profile-field">
                    <span data-i18n="phone">شماره تماس</span>
                    <span id="profile-phone">---</span>
                </div>
                <div class="profile-field">
                    <span data-i18n="ads_count">تعداد آگهی‌ها</span>
                    <span id="profile-ads-count">0</span>
                </div>
                <div class="profile-field">
                    <span data-i18n="member_since">عضو از</span>
                    <span id="profile-member-since">---</span>
                </div>
                <button class="btn" id="admin-toggle" style="margin-top:1rem;"><i class="fas fa-cog"></i> <span data-i18n="admin">مدیریت</span></button>
            </div>
        </div>

        <!-- صفحه پنل مدیریت -->
        <div id="admin-page" class="page">
            <div class="admin-panel">
                <h2 style="margin-bottom:1rem;"><i class="fas fa-cog"></i> <span data-i18n="admin">پنل مدیریت</span></h2>
                <div id="admin-login-section">
                    <div class="form-group">
                        <label data-i18n="admin_token">توکن ادمین</label>
                        <input type="password" id="admin-token" data-i18n-placeholder="enter_token" placeholder="توکن خود را وارد کنید">
                    </div>
                    <button class="btn" id="admin-login"><i class="fas fa-sign-in-alt"></i> <span data-i18n="login">ورود</span></button>
                </div>
                <div id="admin-content" style="display: none;">
                    <div class="admin-tabs">
                        <button class="admin-tab active" data-tab="pending"><span data-i18n="pending_ads">در انتظار</span></button>
                        <button class="admin-tab" data-tab="prices"><span data-i18n="price_settings">قیمت‌ها</span></button>
                        <button class="admin-tab" data-tab="feedback"><span data-i18n="feedback">بازخوردها</span></button>
                        <button class="admin-tab" data-tab="stats"><span data-i18n="statistics">آمار</span></button>
                        <button class="admin-tab" data-tab="users"><span data-i18n="users">کاربران</span></button>
                    </div>
                    <div class="admin-tab-content" id="admin-pending">
                        <table class="admin-table" id="pending-table">
                            <thead><tr><th data-i18n="id">شناسه</th><th data-i18n="title">عنوان</th><th data-i18n="phone">شماره</th><th data-i18n="actions">عملیات</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="admin-tab-content" id="admin-prices" style="display: none;">
                        <div class="form-group"><label data-i18n="price_special1">قیمت ویژه ۱ روزه</label><input type="number" id="price_special1"></div>
                        <div class="form-group"><label data-i18n="price_special3">قیمت ویژه ۳ روزه</label><input type="number" id="price_special3"></div>
                        <div class="form-group"><label data-i18n="price_vip1">قیمت VIP 1 ماهه</label><input type="number" id="price_vip1"></div>
                        <div class="form-group"><label data-i18n="price_vip3">قیمت VIP 3 ماهه</label><input type="number" id="price_vip3"></div>
                        <div class="form-group"><label data-i18n="price_vip6">قیمت VIP 6 ماهه</label><input type="number" id="price_vip6"></div>
                        <button class="btn" id="save-prices"><span data-i18n="save">ذخیره</span></button>
                    </div>
                    <div class="admin-tab-content" id="admin-feedback" style="display: none;">
                        <table class="admin-table" id="feedback-table">
                            <thead><tr><th data-i18n="name">نام</th><th data-i18n="phone">شماره</th><th data-i18n="message">پیام</th><th data-i18n="date">تاریخ</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="admin-tab-content" id="admin-stats" style="display: none;">
                        <div id="stats-content" style="background:rgba(0,0,0,0.2); padding:1rem; border-radius:1rem;"></div>
                    </div>
                    <div class="admin-tab-content" id="admin-users" style="display: none;">
                        <table class="admin-table" id="users-table">
                            <thead><tr><th data-i18n="id">شناسه</th><th data-i18n="username">نام کاربری</th><th data-i18n="phone">شماره</th><th data-i18n="ads_count">تعداد آگهی</th><th data-i18n="actions">عملیات</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- نوار پایین ثابت -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-page="home"><i class="fas fa-home"></i><span data-i18n="home">خانه</span></div>
        <div class="nav-item" data-page="submit"><i class="fas fa-plus-circle"></i><span data-i18n="post_ad">ثبت</span></div>
        <div class="nav-item" data-page="favorites"><i class="fas fa-heart"></i><span data-i18n="favorites">علاقه‌مندی</span></div>
        <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span data-i18n="profile">پروفایل</span></div>
    </nav>

    <!-- مودال جزئیات آگهی -->
    <div class="modal" id="ad-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div id="modal-detail"></div>
        </div>
    </div>

    <script>
        // ==================== تنظیمات ====================
        const API_URL = 'https://j-dar-market.j-dar-market.workers.dev';
        let currentLang = localStorage.getItem('lang') || 'fa';
        let categories = [];
        let currentMainCat = null;
        let currentSubCat = null;
        let allAds = [];
        let adminToken = localStorage.getItem('adminToken') || '';
        let uploadedFileIds = [];
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        // ترجمه‌ها (کامل)
        const translations = {
            fa: {
                lang_fa: 'FA', lang_ar: 'AR', lang_en: 'EN',
                home: 'خانه',
                post_ad: 'ثبت آگهی',

        function t(key) {
            return translations[currentLang]?.[key] || key;
        }

        function updateUILang() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') {
                    if (el.getAttribute('data-i18n-placeholder')) {
                        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
                    }
                } else {
                    el.innerText = t(key);
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
            });
            document.documentElement.lang = currentLang;
            document.documentElement.dir = (currentLang === 'fa' || currentLang === 'ar') ? 'rtl' : 'ltr';
        }

        async function fetchAPI(endpoint, options = {}) {
            const url = `${API_URL}${endpoint}`;
            options.headers = options.headers || {};
            if (!(options.body instanceof FormData)) {
                options.headers['Content-Type'] = 'application/json';
            }
            try {
                const res = await fetch(url, options);
                return await res.json();
            } catch (e) {
                console.error(e);
                return { success: false, error: t('error_connection') };
            }
        }

        function showMessage(msg) { alert(msg); }

        // ==================== بارگذاری دسته‌بندی‌ها ====================
        async function loadCategories() {
            try {
                const data = await fetchAPI('/api/categories');
                if (data.success) {
                    categories = data.categories;
                    renderMainCategories();
                }
            } catch (e) { console.error(e); }
        }

        function renderMainCategories() {
            const mains = categories.filter(c => !c.parent_id);
            let html = mains.map(c => 
                `<span class="category-chip ${currentMainCat === c.id ? 'active' : ''}" data-id="${c.id}">${c.name_fa}</span>`
            ).join('');
            document.getElementById('main-categories').innerHTML = html;
            document.querySelectorAll('#main-categories .category-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    currentMainCat = currentMainCat === id ? null : id;
                    currentSubCat = null;
                    renderMainCategories();
                    renderSubCategories();
                    loadAds();
                });
            });
            renderSubCategories();
        }

        function renderSubCategories() {
            if (!currentMainCat) {
                document.getElementById('sub-categories').innerHTML = '';
                return;
            }
            const subs = categories.filter(c => c.parent_id === currentMainCat);
            let html = `<span class="category-chip ${currentSubCat === null ? 'active' : ''}" data-id="all">${t('all') || 'همه'}</span>`;
            html += subs.map(c => 
                `<span class="category-chip ${currentSubCat === c.id ? 'active' : ''}" data-id="${c.id}">${c.name_fa}</span>`
            ).join('');
            document.getElementById('sub-categories').innerHTML = html;
            document.querySelectorAll('#sub-categories .category-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id === 'all' ? null : parseInt(btn.dataset.id);
                    currentSubCat = id;
                    renderSubCategories();
                    loadAds();
                });
            });
        }

        // ==================== بارگذاری آگهی‌ها ====================
        async function loadAds() {
            let url = '/api/ads?';
            if (currentMainCat) url += `category=${currentMainCat}&`;
            if (currentSubCat) url += `subcategory=${currentSubCat}&`;
            const search = document.getElementById('search-input').value.trim();
            if (search) url += `search=${encodeURIComponent(search)}&`;
            try {
                const data = await fetchAPI(url);
                if (data.success) {
                    allAds = data.ads;
                    renderAds(allAds);
                } else {
                    allAds = [];
                    renderAds([]);
                }
            } catch (e) { console.error(e); }
        }

        function getImageUrl(imageIds) {
            if (!imageIds || imageIds.length === 0) return 'https://via.placeholder.com/300x200?text=جدار';
            try {
                const ids = Array.isArray(imageIds) ? imageIds : JSON.parse(imageIds);
                return ids.length ? `${API_URL}/image/${ids[0]}` : 'https://via.placeholder.com/300x200?text=جدار';
            } catch {
                return 'https://via.placeholder.com/300x200?text=جدار';
            }
        }

        function renderAds(ads) {
            const container = document.getElementById('ads-list');
            if (!ads.length) {
                container.innerHTML = `<p style="text-align:center; color:#aaa;">${t('no_ads')}</p>`;
                return;
            }
            container.innerHTML = ads.map(ad => {
                const imgUrl = getImageUrl(ad.images);
                const isFav = favorites.includes(ad.id);
                return `
                    <div class="ad-card" data-id="${ad.id}">
                        <img src="${imgUrl}" class="ad-card-image" onerror="this.src='https://via.placeholder.com/300x200?text=جدار'">
                        <div class="ad-card-content">
                            <div class="ad-card-title">${ad.title}</div>
                            <div class="ad-card-price">💰 ${ad.price || 'توافقی'} ${ad.currency || ''}</div>
                            <div class="ad-card-meta">
                                <span><i class="fas fa-phone"></i> ${ad.phone}</span>
                                <span><i class="fas fa-eye"></i> ${ad.views || 0}</span>
                            </div>
                        </div>
                        <div class="favorite-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, ${ad.id})"><i class="fa${isFav ? 's' : 'r'} fa-heart"></i></div>
                    </div>
                `;
            }).join('');
            document.querySelectorAll('#ads-list .ad-card').forEach(card => {
                card.addEventListener('click', (e) => { if (!e.target.closest('.favorite-btn')) showAdDetail(card.dataset.id); });
            });
        }

        window.toggleFavorite = (e, id) => {
            e.stopPropagation();
            const index = favorites.indexOf(id);
            if (index === -1) favorites.push(id);
            else favorites.splice(index, 1);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderAds(allAds);
            renderFavorites();
        };

        function renderFavorites() {
            const favAds = allAds.filter(ad => favorites.includes(ad.id));
            const container = document.getElementById('favorites-list');
            if (!favAds.length) {
                container.innerHTML = `<p style="color:#aaa;">${t('no_favorites')}</p>`;
                return;
            }
            container.innerHTML = favAds.map(ad => {
                const imgUrl = getImageUrl(ad.images);
                return `
                    <div class="ad-card" data-id="${ad.id}">
                        <img src="${imgUrl}" class="ad-card-image" onerror="this.src='https://via.placeholder.com/300x200?text=جدار'">
                        <div class="ad-card-content">
                            <div class="ad-card-title">${ad.title}</div>
                            <div class="ad-card-price">💰 ${ad.price || 'توافقی'}</div>
                        </div>
                        <div class="favorite-btn active" onclick="toggleFavorite(event, ${ad.id})"><i class="fas fa-heart"></i></div>
                    </div>
                `;
            }).join('');
            document.querySelectorAll('#favorites-list .ad-card').forEach(card => {
                card.addEventListener('click', (e) => { if (!e.target.closest('.favorite-btn')) showAdDetail(card.dataset.id); });
            });
        }

        // ==================== نمایش جزئیات آگهی ====================
        async function showAdDetail(id) {
            try {
                const data = await fetchAPI(`/api/ads/${id}`);
                if (data.success) {
                    const ad = data.ad;
                    let images = [];
                    try { images = JSON.parse(ad.images || '[]'); } catch { images = []; }
                    const imagesHtml = images.map(img => `<img src="${API_URL}/image/${img}" onerror="this.src='https://via.placeholder.com/150?text=J-DAR'">`).join('');
                    const date = new Date(ad.created_at * 1000).toLocaleDateString('fa-IR');
                    document.getElementById('modal-detail').innerHTML = `
                        <h2>${ad.title}</h2>
                        <div class="modal-images">${imagesHtml || '<p>بدون تصویر</p>'}</div>
                        <p><strong>${t('enter_price')}:</strong> ${ad.price || 'توافقی'} ${ad.currency || ''}</p>
                        <p><strong>${t('enter_description')}:</strong> ${ad.description}</p>
                        <p><strong>${t('enter_phone')}:</strong> ${ad.phone}</p>
                        ${ad.whatsapp ? `<p><strong>${t('whatsapp')}:</strong> ${ad.whatsapp}</p>` : ''}
                        <p><strong>${t('date')}:</strong> ${date}</p>
                        <p><strong>${t('total_views')}:</strong> ${ad.views || 0}</p>
                    `;
                    document.getElementById('ad-modal').classList.add('active');
                    fetchAPI(`/api/view/${id}`, { method: 'POST' });
                }
            } catch (e) { console.error(e); }
        }

        // ==================== ثبت آگهی ====================
        document.getElementById('ad-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const category_id = parseInt(document.getElementById('main-category').value);
            const subcategory_id = document.getElementById('sub-category').value ? parseInt(document.getElementById('sub-category').value) : undefined;
            const price = document.getElementById('price').value;
            const currency = document.getElementById('currency').value;
            const phone = document.getElementById('phone').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const images = uploadedFileIds;

            const data = { title, description, category_id, subcategory_id, price, currency, phone, whatsapp, images };
            try {
                const res = await fetchAPI('/api/ads', { method:'POST', body: JSON.stringify(data) });
                if (res.success) {
                    showMessage(t('ad_submitted'));
                    document.getElementById('ad-form').reset();
                    uploadedFileIds = [];
                    document.getElementById('image-preview').innerHTML = '';
                    showPage('home');
                } else showMessage(t('error') + ': ' + res.error);
            } catch { showMessage(t('error_connection')); }
        });

        // آپلود تصویر
        document.getElementById('image-input').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length + uploadedFileIds.length > 5) { alert(t('max_images')); return; }
            for (let file of files) {
                const formData = new FormData(); formData.append('file', file);
                try {
                    const res = await fetch(`${API_URL}/api/upload`, { method:'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        uploadedFileIds.push(data.fileId);
                        const preview = document.getElementById('image-preview');
                        const img = document.createElement('img'); img.src = `${API_URL}/image/${data.fileId}`;
                        preview.appendChild(img);
                    } else alert(t('image_upload_error') + ': ' + data.error);
                } catch { alert(t('image_upload_error')); }
            }
        });

        // ==================== پنل مدیریت ====================
        document.getElementById('admin-login').addEventListener('click', async () => {
            const token = document.getElementById('admin-token').value;
            if (token) {
                adminToken = token; localStorage.setItem('adminToken', token);
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminData();
            }
        });

        async function authFetch(url, options = {}) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = `Bearer ${adminToken}`;
            return fetchAPI(url, options);
        }

                document.querySelector('#pending-table tbody').innerHTML = data.ads.map(ad => `

                price_vip6: document.getElementById('price_vip6').value
            };

        document.querySelectorAll('.admin-tab').forEach(tab => {

                tab.classList.add('active');
                document.querySelectorAll('.admin-tab-content').forEach(c => c.style.display = 'none');
                document.getElementById(`admin-${tab.dataset.tab}`).style.display = 'block';
            });
        });

        // ==================== ناوبری ====================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === pageId);
            });
            if (pageId === 'home') loadAds();
            else if (pageId === 'favorites') renderFavorites();
            else if (pageId === 'profile') loadProfile();
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => showPage(item.dataset.page));
        });

        document.getElementById('admin-toggle').addEventListener('click', () => showPage('admin'));

        // پروفایل
        function loadProfile() {
            // اینجا می‌توان از API پروفایل استفاده کرد، فعلاً ساختگی
            document.getElementById('profile-username').innerText = 'کاربر نمونه';
            document.getElementById('profile-phone').innerText = '۰۹۱۲۳۴۵۶۷۸۹';
            document.getElementById('profile-ads-count').innerText = allAds.length;
            document.getElementById('profile-member-since').innerText = '۱۴۰۲/۰۱/۰۱';
        }

        // ==================== تغییر زبان ====================
        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            updateUILang();
            loadAds();
            renderFavorites();
        }
        document.getElementById('lang-fa').addEventListener('click', () => setLang('fa'));
        document.getElementById('lang-ar').addEventListener('click', () => setLang('ar'));
        document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

        // بستن مودال
        document.getElementById('close-modal').addEventListener('click', () => document.getElementById('ad-modal').classList.remove('active'));

        // پر کردن dropdown دسته‌ها
        function populateCategoryDropdowns() {
            const mainSelect = document.getElementById('main-category');
            mainSelect.innerHTML = '<option value="">' + t('select_option') + '</option>' + 
                categories.filter(c => !c.parent_id).map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
            mainSelect.onchange = function() {
                const id = parseInt(this.value);
                const subSelect = document.getElementById('sub-category');
                if (!id) { subSelect.innerHTML = '<option value="">' + t('no_subcategory') + '</option>'; return; }
                const subs = categories.filter(c => c.parent_id === id);
                subSelect.innerHTML = '<option value="">' + t('no_subcategory') + '</option>' + subs.map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
            };
        }

        // ==================== PWA ====================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed', err));
            });
        }

        // شروع
        loadCategories();
        loadAds();
        updateUILang();
        populateCategoryDropdowns();

        // اطلاعات ساختگی برای پروفایل
        loadProfile();
    </script>
</body>
