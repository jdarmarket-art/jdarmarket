<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جدار | بازارچه تخصصی گردشگری، زیارت و پزشکی</title>
    <!-- فونت وزیر -->
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <!-- فونت awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* استایل‌های فایل ۹ (زیبا و مدرن) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazir', 'Tahoma', sans-serif;
            background: #0b0b12;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            direction: rtl;
        }

        /* پس‌زمینه گرادیان */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(115, 70, 250, 0.15) 0%, transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(255, 80, 150, 0.1) 0%, transparent 70%),
                        #0b0b12;
            z-index: -2;
        }

        /* کانتینر اصلی */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 90px;
            position: relative;
            z-index: 10;
        }

        /* هدر شیشه‌ای ثابت */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 18, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(145deg, #8b5cf6, #c084fc);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 8px 18px rgba(139, 92, 246, 0.4);
        }

        .logo-text {
            font-weight: 800;
            font-size: 24px;
            background: linear-gradient(135deg, #fff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-left {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(139, 92, 246, 0.2);
            color: #fff;
            border-color: #8b5cf6;
        }

        /* کارت کیف پول (دکوری) */
        .wallet-card {
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.6);
        }

        .wallet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-info h4 {
            font-size: 14px;
            color: #aaa;
            font-weight: 500;
        }

        .wallet-info .amount {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }

        .wallet-info small {
            font-size: 14px;
            color: #8b5cf6;
        }

        .wallet-points {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 40px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fbbf24;
        }

        .wallet-points i {
            font-size: 22px;
        }

        .wallet-points .points-num {
            font-weight: 700;
            font-size: 20px;
            color: #fff;
        }

        /* کارت اطلاعیه (دکوری) */
        .notice-card {
            background: rgba(30, 30, 40, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 40px;
            padding: 16px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notice-icon {
            width: 44px;
            height: 44px;
            background: #f59e0b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            flex-shrink: 0;
        }

        .notice-text {
            flex: 1;
            color: #fcd34d;
            font-size: 14px;
            line-height: 1.6;
        }

        .notice-edit {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #f59e0b;
            font-size: 18px;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .notice-edit:hover {
            background: #f59e0b;
            color: white;
        }

        /* گرید اقدامات سریع */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .action-item {
            background: rgba(25, 25, 35, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.25s;
            color: #fff;
        }

        .action-item:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
            transform: translateY(-5px);
        }

        .action-item i {
            font-size: 28px;
            color: #c4b5fd;
        }

        .action-item span {
            font-size: 11px;
            font-weight: 500;
            opacity: 0.8;
        }

        /* باکس جستجو */
        .search-box {
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 60px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .search-box i {
            color: #aaa;
            font-size: 20px;
            margin-left: 12px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .search-box button {
            background: #8b5cf6;
            border: none;
            border-radius: 40px;
            padding: 8px 22px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .search-box button:hover {
            background: #7c3aed;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title h3 {
            font-weight: 600;
            font-size: 18px;
            color: #fff;
        }

        .section-title a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .section-title a:hover {
            color: #a58aff;
        }

        /* دسته‌بندی‌ها */
        .categories {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background: rgba(30, 30, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 10px 22px;
            white-space: nowrap;
            color: #ddd;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
            font-size: 14px;
        }

        .category-chip.active, .category-chip:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
            color: white;
        }

        /* گرید آگهی‌ها دو ستونه */
        .ads-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .ad-card {
            background: rgba(20, 20, 28, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.25s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .ad-card:hover {
            transform: translateY(-6px);
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 20px 30px -15px #8b5cf6;
        }

        .ad-card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #1a1a24;
            position: relative;
            overflow: hidden;
        }

        .ad-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .ad-card:hover .ad-card-image img {
            transform: scale(1.05);
        }

        .ad-card-image .watermark {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 2;
        }

        .ad-card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ad-card-title {
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
            min-height: 45px;
        }

        .ad-card-price {
            font-weight: 700;
            font-size: 16px;
            color: #8b5cf6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ad-card-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ad-card-meta i {
            font-size: 12px;
            color: #a58aff;
        }

        .special-badge {
            background: #f59e0b;
            color: white;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* مودال جزئیات آگهی */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            z-index: 1000;
            overflow-y: auto;
            padding: 0;
        }

        .modal.active { display: block; }

        .modal-content {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(15, 15, 20, 0.9);
            backdrop-filter: blur(20px);
            border: none;
            border-radius: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-back {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #8b5cf6;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 1001;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-back:hover { transform: scale(1.1); }

        .modal-content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 100px 20px;
        }

        .modal-images {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .modal-images img {
            height: 200px;
            border-radius: 1rem;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-price {
            font-size: 20px;
            font-weight: 600;
            color: #8b5cf6;
            margin: 10px 0;
        }

        .modal-description {
            background: rgba(255,255,255,0.03);
            border-radius: 30px;
            padding: 16px;
            margin: 15px 0;
            color: #ddd;
        }

        .modal-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px 20px;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 15px;
            justify-content: center;
            z-index: 1000;
        }

        .modal-footer button {
            flex: 1;
            padding: 14px 12px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 16px;
            border: none;
        }

        .chat-btn {
            background: #8b5cf6;
            color: white;
        }

        .chat-btn:hover {
            opacity: 0.9;
            transform: translateY(-3px);
        }

        .contact-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #8b5cf6 !important;
            color: #fff;
        }

        .contact-btn:hover {
            background: #8b5cf6;
            color: white;
        }

        /* فرم ثبت آگهی */
        .form-container {
            background: rgba(20, 20, 28, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 14px;
        }

        .image-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .image-preview img {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            object-fit: cover;
        }

        .btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            color: white;
            padding: 14px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        /* پنل مدیریت */
        .admin-panel {
            background: rgba(20, 20, 28, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: transparent;
            border: 1px solid #8b5cf6;
            color: #8b5cf6;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .admin-tab.active, .admin-tab:hover {
            background: #8b5cf6;
            color: white;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            overflow: hidden;
        }

        .admin-table th, .admin-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: right;
        }

        .admin-table th {
            background: rgba(139, 92, 246, 0.2);
            color: #d8b4fe;
        }

        .admin-table button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            cursor: pointer;
            margin: 0 3px;
        }

        .admin-table button:hover {
            background: #8b5cf6;
        }

        /* نوار پایین */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(15, 15, 20, 0.8);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
        }

        .nav-item.active {
            color: #a58aff;
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 2px;
        }

        /* دکمه شناور واتساپ (اختیاری) */
        .whatsapp-float {
            position: fixed;
            bottom: 80px;
            left: 20px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
            z-index: 99;
            border: 2px solid rgba(255,255,255,0.2);
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            background: #20b859;
        }

        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <!-- هدر -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            <span class="logo-text">J-DAR</span>
        </div>
        <div class="header-left">
            <button class="icon-btn" id="lang-fa" title="فارسی"><i class="fas fa-globe"></i></button>
            <button class="icon-btn" id="lang-ar" title="العربية">AR</button>
            <button class="icon-btn" id="lang-en" title="English">EN</button>
            <button class="icon-btn" id="admin-toggle" title="مدیریت"><i class="fas fa-cog"></i></button>
        </div>
    </div>

    <!-- دکمه شناور واتساپ (اختیاری) -->
    <a href="https://wa.me/989332356547" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- محتوای اصلی -->
    <div class="container">
        <!-- کیف پول (دکوری) -->
        <div class="wallet-card">
            <div class="wallet-row">
                <div class="wallet-info">
                    <h4>💰 موجودی کیف پول</h4>
                    <div class="amount"><span id="walletBalance">۰</span> <small>تومان</small></div>
                </div>
                <div class="wallet-points">
                    <i class="fas fa-star"></i>
                    <span class="points-num" id="userPoints">۰</span>
                </div>
            </div>
        </div>

        <!-- کارت اطلاعیه (دکوری) -->
        <div class="notice-card">
            <div class="notice-icon"><i class="fas fa-bullhorn"></i></div>
            <div class="notice-text" id="noticeText">تنها حمایت شما از این پلتفرم، معرفی آن به دوستان و آشنایانتان است. با تشکر از همراهی شما.</div>
            <div class="notice-edit" id="noticeEditBtn" style="display: none;"><i class="fas fa-pencil-alt"></i></div>
        </div>

        <!-- گرید اقدامات سریع -->
        <div class="action-grid">
            <div class="action-item" id="submit-link">
                <i class="fas fa-plus-circle"></i>
                <span>ثبت آگهی</span>
            </div>
            <div class="action-item" id="vipPlaceholder">
                <i class="fas fa-crown"></i>
                <span>ویژه</span>
            </div>
            <div class="action-item" id="chargePlaceholder">
                <i class="fas fa-wallet"></i>
                <span>شارژ</span>
            </div>
            <div class="action-item" id="convertPlaceholder">
                <i class="fas fa-gift"></i>
                <span>تبدیل</span>
            </div>
        </div>

        <!-- صفحه اصلی (خانه) -->
        <div id="home-page" class="page active">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="جستجو در آگهی‌ها...">
                <button id="search-btn">جستجو</button>
            </div>

            <div class="section-title">
                <h3>دسته‌بندی‌ها</h3>
                <a href="#" id="all-categories-link">همه</a>
            </div>
            <div class="categories" id="main-categories"></div>
            <div class="categories" id="sub-categories"></div>

            <div class="section-title">
                <h3>آگهی‌ها</h3>
                <a href="#" id="more-ads-link">بیشتر</a>
            </div>
            <div class="ads-grid" id="ads-list"></div>
        </div>

        <!-- صفحه ثبت آگهی -->
        <div id="submit-page" class="page">
            <div class="form-container">
                <h2 style="margin-bottom: 20px;"><i class="fas fa-plus-circle" style="color: #8b5cf6;"></i> ثبت آگهی جدید</h2>
                <form id="ad-form">
                    <div class="form-group">
                        <label>عنوان آگهی</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>توضیحات</label>
                        <textarea id="description" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>دسته اصلی</label>
                        <select id="main-category" required>
                            <option value="">انتخاب کنید</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>زیرمجموعه (اختیاری)</label>
                        <select id="sub-category">
                            <option value="">بدون زیرمجموعه</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>قیمت (اختیاری)</label>
                        <input type="text" id="price" placeholder="مثلاً ۵۰۰,۰۰۰ تومان">
                    </div>
                    <div class="form-group">
                        <label>واحد پول</label>
                        <select id="currency">
                            <option value="تومان">تومان</option>
                            <option value="دلار">دلار</option>
                            <option value="دینار">دینار</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>شماره تماس</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label>واتساپ (اختیاری)</label>
                        <input type="text" id="whatsapp">
                    </div>
                    <div class="form-group">
                        <label>تصاویر (حداکثر ۵)</label>
                        <input type="file" id="image-input" accept="image/*" multiple>
                        <div class="image-preview" id="image-preview"></div>
                    </div>
                    <button type="submit" class="btn"><i class="fas fa-save"></i> ثبت آگهی</button>
                </form>
            </div>
        </div>

        <!-- پنل مدیریت -->
        <div id="admin-panel" class="page">
            <div class="admin-panel">
                <h2 style="margin-bottom: 20px;"><i class="fas fa-cog" style="color: #8b5cf6;"></i> پنل مدیریت</h2>
                <div id="admin-login-section">
                    <div class="form-group">
                        <label>توکن ادمین</label>
                        <input type="password" id="admin-token" placeholder="توکن خود را وارد کنید">
                    </div>
                    <button class="btn" id="admin-login"><i class="fas fa-sign-in-alt"></i> ورود</button>
                </div>
                <div id="admin-content" style="display: none;">
                    <div class="admin-tabs">
                        <button class="admin-tab active" data-tab="pending">در انتظار</button>
                        <button class="admin-tab" data-tab="prices">قیمت‌ها</button>
                        <button class="admin-tab" data-tab="feedback">بازخوردها</button>
                        <button class="admin-tab" data-tab="stats">آمار</button>
                    </div>
                    <div class="admin-tab-content" id="admin-pending">
                        <table class="admin-table" id="pending-table">
                            <thead><tr><th>شناسه</th><th>عنوان</th><th>شماره</th><th>عملیات</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="admin-tab-content" id="admin-prices" style="display: none;">
                        <div class="form-group"><label>قیمت ویژه ۱ روزه</label><input type="number" id="price_special1"></div>
                        <div class="form-group"><label>قیمت ویژه ۳ روزه</label><input type="number" id="price_special3"></div>
                        <div class="form-group"><label>قیمت VIP 1 ماهه</label><input type="number" id="price_vip1"></div>
                        <div class="form-group"><label>قیمت VIP 3 ماهه</label><input type="number" id="price_vip3"></div>
                        <div class="form-group"><label>قیمت VIP 6 ماهه</label><input type="number" id="price_vip6"></div>
                        <button class="btn" id="save-prices">ذخیره</button>
                    </div>
                    <div class="admin-tab-content" id="admin-feedback" style="display: none;">
                        <table class="admin-table" id="feedback-table">
                            <thead><tr><th>نام</th><th>شماره</th><th>پیام</th><th>تاریخ</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="admin-tab-content" id="admin-stats" style="display: none;">
                        <div id="stats-content"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- مودال جزئیات آگهی -->
        <div class="modal" id="ad-modal">
            <div class="modal-content">
                <button class="modal-back" id="close-modal"><i class="fas fa-arrow-right"></i></button>
                <div class="modal-content-scroll" id="modal-detail"></div>
            </div>
        </div>
    </div>

    <!-- نوار پایین -->
    <div class="bottom-nav">
        <div class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>خانه</span></div>
        <div class="nav-item" data-page="submit"><i class="fas fa-plus-circle"></i><span>ثبت</span></div>
        <div class="nav-item" data-page="admin"><i class="fas fa-cog"></i><span>مدیریت</span></div>
    </div>

    <script>
        // ==================== تنظیمات ====================
        const API_URL = 'https://jdar-platform.your-subdomain.workers.dev'; // آدرس Worker خود را اینجا قرار دهید
        let currentLang = localStorage.getItem('lang') || 'fa';
        let categories = [];
        let currentMainCat = null;
        let currentSubCat = null;
        let allAds = [];
        let adminToken = localStorage.getItem('adminToken') || '';
        let uploadedFileIds = [];

        // ترجمه‌ها
        const translations = {
            fa: {
                home: 'خانه',
                post_ad: 'ثبت آگهی',
                admin: 'مدیریت',
                search: 'جستجو',
                enter_title: 'عنوان آگهی',
                enter_description: 'توضیحات',
                select_category: 'دسته اصلی',
                select_subcategory: 'زیرمجموعه (اختیاری)',
                enter_price: 'قیمت (اختیاری)',
                select_currency: 'واحد پول',
                enter_phone: 'شماره تماس',
                enter_photos: 'تصاویر (حداکثر ۵)',
                save: 'ثبت آگهی',
                pending_ads: 'در انتظار',
                price_settings: 'قیمت‌ها',
                feedback: 'بازخوردها',
                statistics: 'آمار',
                no_ads: 'آگهی‌ای یافت نشد',
                approve: 'تأیید',
                reject: 'رد',
                view: 'مشاهده',
            },
            ar: {
                home: 'الرئيسية',
                post_ad: 'إعلان',
                admin: 'الإدارة',
                search: 'بحث',
                enter_title: 'العنوان',
                enter_description: 'الوصف',
                select_category: 'الفئة الرئيسية',
                select_subcategory: 'الفئة الفرعية',
                enter_price: 'السعر',
                select_currency: 'العملة',
                enter_phone: 'رقم الهاتف',
                enter_photos: 'الصور',
                save: 'حفظ',
                pending_ads: 'قيد الانتظار',
                price_settings: 'الأسعار',
                feedback: 'الآراء',
                statistics: 'الإحصائيات',
                no_ads: 'لا توجد إعلانات',
                approve: 'موافقة',
                reject: 'رفض',
                view: 'عرض',
            },
            en: {
                home: 'Home',
                post_ad: 'Post Ad',
                admin: 'Admin',
                search: 'Search',
                enter_title: 'Title',
                enter_description: 'Description',
                select_category: 'Main Category',
                select_subcategory: 'Subcategory',
                enter_price: 'Price',
                select_currency: 'Currency',
                enter_phone: 'Phone',
                enter_photos: 'Photos (max 5)',
                save: 'Submit',
                pending_ads: 'Pending',
                price_settings: 'Prices',
                feedback: 'Feedback',
                statistics: 'Stats',
                no_ads: 'No ads found',
                approve: 'Approve',
                reject: 'Reject',
                view: 'View'
            }
        };

        function t(key) {
            return translations[currentLang]?.[key] || key;
        }

        function updateUILang() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = t(key);
            });
            document.documentElement.lang = currentLang;
            document.documentElement.dir = (currentLang === 'fa' || currentLang === 'ar') ? 'rtl' : 'ltr';
        }

        async function fetchAPI(endpoint, options = {}) {
            const url = `${API_URL}${endpoint}`;
            options.headers = options.headers || {};
            if (!(options.body instanceof FormData)) {
                options.headers['Content-Type'] = 'application/json';
            }
            const res = await fetch(url, options);
            return await res.json();
        }

        function showMessage(msg, type = 'success') {
            alert(msg);
        }

        // ==================== بارگذاری دسته‌بندی‌ها ====================
        async function loadCategories() {
            try {
                const data = await fetchAPI('/api/categories');
                if (data.success) {
                    categories = data.categories;
                    renderMainCategories();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderMainCategories() {
            const mains = categories.filter(c => !c.parent_id);
            let html = mains.map(c => 
                `<span class="category-chip ${currentMainCat === c.id ? 'active' : ''}" data-id="${c.id}">${c.name_fa}</span>`
            ).join('');
            document.getElementById('main-categories').innerHTML = html;
            document.querySelectorAll('#main-categories .category-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    currentMainCat = currentMainCat === id ? null : id;
                    currentSubCat = null;
                    renderMainCategories();
                    renderSubCategories();
                    loadAds();
                });
            });
            renderSubCategories();
        }

        function renderSubCategories() {
            if (!currentMainCat) {
                document.getElementById('sub-categories').innerHTML = '';
                return;
            }
            const subs = categories.filter(c => c.parent_id === currentMainCat);
            let html = `<span class="category-chip ${currentSubCat === null ? 'active' : ''}" data-id="all">همه</span>`;
            html += subs.map(c => 
                `<span class="category-chip ${currentSubCat === c.id ? 'active' : ''}" data-id="${c.id}">${c.name_fa}</span>`
            ).join('');
            document.getElementById('sub-categories').innerHTML = html;
            document.querySelectorAll('#sub-categories .category-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id === 'all' ? null : parseInt(btn.dataset.id);
                    currentSubCat = id;
                    renderSubCategories();
                    loadAds();
                });
            });
        }

        // ==================== بارگذاری آگهی‌ها ====================
        async function loadAds() {
            let url = '/api/ads?';
            if (currentMainCat) url += `category=${currentMainCat}&`;
            if (currentSubCat) url += `subcategory=${currentSubCat}&`;
            const search = document.getElementById('search-input').value.trim();
            if (search) url += `search=${encodeURIComponent(search)}&`;
            try {
                const data = await fetchAPI(url);
                if (data.success) {
                    allAds = data.ads;
                    renderAds(allAds);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderAds(ads) {
            const container = document.getElementById('ads-list');
            if (!ads.length) {
                container.innerHTML = `<p style="text-align:center; color:#aaa;">${t('no_ads')}</p>`;
                return;
            }
            container.innerHTML = ads.map(ad => {
                let images = [];
                try { images = JSON.parse(ad.images || '[]'); } catch { images = []; }
                const imgUrl = images.length ? `${API_URL}/image/${images[0]}` : 'https://via.placeholder.com/400x400?text=J-DAR';
                return `
                    <div class="ad-card" data-id="${ad.id}">
                        <div class="ad-card-image">
                            <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/400x400?text=J-DAR'">
                            <div class="watermark">J-DAR</div>
                        </div>
                        <div class="ad-card-content">
                            <div class="ad-card-title">${ad.title}</div>
                            <div class="ad-card-price">💰 ${ad.price || 'توافقی'} ${ad.currency || ''}</div>
                            <div class="ad-card-meta">
                                <span><i class="fas fa-phone"></i> ${ad.phone}</span>
                                <span><i class="fas fa-eye"></i> ${ad.views || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            document.querySelectorAll('#ads-list .ad-card').forEach(card => {
                card.addEventListener('click', () => showAdDetail(card.dataset.id));
            });
        }

        // ==================== نمایش جزئیات آگهی ====================
        async function showAdDetail(id) {
            try {
                const data = await fetchAPI(`/api/ads/${id}`);
                if (data.success) {
                    const ad = data.ad;
                    let images = [];
                    try { images = JSON.parse(ad.images || '[]'); } catch { images = []; }
                    const imagesHtml = images.map(img => `<img src="${API_URL}/image/${img}" alt="">`).join('');
                    const date = new Date(ad.created_at * 1000).toLocaleDateString('fa-IR');
                    document.getElementById('modal-detail').innerHTML = `
                        <h2 class="modal-title">${ad.title}</h2>
                        <div class="modal-images">${imagesHtml || '<p style="color:#aaa;">بدون تصویر</p>'}</div>
                        <div class="modal-price">💰 ${ad.price || 'توافقی'} ${ad.currency || ''}</div>
                        <div class="modal-description"><strong>توضیحات:</strong><br>${ad.description}</div>
                        <p><strong>شماره:</strong> ${ad.phone}</p>
                        ${ad.whatsapp ? `<p><strong>واتساپ:</strong> ${ad.whatsapp}</p>` : ''}
                        <p><strong>تاریخ:</strong> ${date}</p>
                        <p><strong>بازدید:</strong> ${ad.views || 0}</p>
                        <div class="modal-footer" style="position: static; margin-top: 20px;">
                            <button class="contact-btn" onclick="window.location.href='tel:${ad.phone}'"><i class="fas fa-phone-alt"></i> تماس</button>
                            ${ad.whatsapp ? `<button class="chat-btn" onclick="window.open('https://wa.me/${ad.whatsapp.replace(/\D/g,'')}')"><i class="fab fa-whatsapp"></i> واتساپ</button>` : ''}
                        </div>
                    `;
                    document.getElementById('ad-modal').classList.add('active');
                    fetchAPI(`/api/view/${id}`, { method: 'POST' });
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ==================== ثبت آگهی ====================
        document.getElementById('ad-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const category_id = parseInt(document.getElementById('main-category').value);
            const subcategory_id = document.getElementById('sub-category').value ? parseInt(document.getElementById('sub-category').value) : undefined;
            const price = document.getElementById('price').value;
            const currency = document.getElementById('currency').value;
            const phone = document.getElementById('phone').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const images = uploadedFileIds;

            const data = { title, description, category_id, subcategory_id, price, currency, phone, whatsapp, images };
            try {
                const res = await fetchAPI('/api/ads', { method:'POST', body: JSON.stringify(data) });
                if (res.success) {
                    showMessage('آگهی شما ثبت شد و پس از تأیید نمایش داده می‌شود.');
                    document.getElementById('ad-form').reset();
                    uploadedFileIds = [];
                    document.getElementById('image-preview').innerHTML = '';
                    showPage('home');
                } else showMessage('خطا: ' + res.error, 'error');
            } catch { showMessage('خطا در ارتباط', 'error'); }
        });

        // آپلود تصویر
        document.getElementById('image-input').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length + uploadedFileIds.length > 5) { alert('حداکثر ۵ تصویر مجاز است'); return; }
            for (let file of files) {
                const formData = new FormData(); formData.append('file', file);
                try {
                    const res = await fetch(`${API_URL}/api/upload`, { method:'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        uploadedFileIds.push(data.fileId);
                        const preview = document.getElementById('image-preview');
                        const img = document.createElement('img'); img.src = `${API_URL}/image/${data.fileId}`;
                        preview.appendChild(img);
                    } else alert('خطا در آپلود: ' + data.error);
                } catch { alert('خطا در آپلود'); }
            }
        });

        // ==================== پنل مدیریت ====================
        document.getElementById('admin-login').addEventListener('click', async () => {
            const token = document.getElementById('admin-token').value;
            if (token) {
                adminToken = token; localStorage.setItem('adminToken', token);
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminData();
            }
        });

        async function authFetch(url, options = {}) {
            options.headers = options.headers || {};
            options.headers['Authorization'] = `Bearer ${adminToken}`;
            return fetchAPI(url, options);
        }

        async function loadAdminData() { if (!adminToken) return; loadPending(); loadPrices(); loadFeedback(); loadStats(); }
        async function loadPending() {
            const data = await authFetch('/api/admin/pending');
            if (data.success) {
                document.querySelector('#pending-table tbody').innerHTML = data.ads.map(ad => `
                    <tr><td>${ad.id}</td><td>${ad.title}</td><td>${ad.phone}</td>
                    <td><button onclick="approveAd(${ad.id})">✅ تایید</button>
                        <button onclick="rejectAd(${ad.id})">❌ رد</button>
                        <button onclick="showAdDetail(${ad.id})">👁 مشاهده</button></td></tr>`).join('');
            }
        }
        window.approveAd = async (id) => { await authFetch(`/api/admin/approve/${id}`, { method:'POST' }); loadPending(); };
        window.rejectAd = async (id) => { await authFetch(`/api/admin/reject/${id}`, { method:'DELETE' }); loadPending(); };
        async function loadPrices() {
            const data = await authFetch('/api/admin/prices');
            if (data.success) {
                document.getElementById('price_special1').value = data.prices.price_special1 || '';
                document.getElementById('price_special3').value = data.prices.price_special3 || '';
                document.getElementById('price_vip1').value = data.prices.price_vip1 || '';
                document.getElementById('price_vip3').value = data.prices.price_vip3 || '';
                document.getElementById('price_vip6').value = data.prices.price_vip6 || '';
            }
        }
        document.getElementById('save-prices').addEventListener('click', async () => {
            const updates = {
                price_special1: document.getElementById('price_special1').value,
                price_special3: document.getElementById('price_special3').value,
                price_vip1: document.getElementById('price_vip1').value,
                price_vip3: document.getElementById('price_vip3').value,
                price_vip6: document.getElementById('price_vip6').value
            };
            await authFetch('/api/admin/prices', { method:'PUT', body: JSON.stringify(updates) });
            showMessage('قیمت‌ها به‌روز شدند');
        });
        async function loadFeedback() {
            const data = await authFetch('/api/admin/feedback');
            if (data.success) {
                document.querySelector('#feedback-table tbody').innerHTML = data.feedbacks.map(f => `
                    <tr><td>${f.name || '-'}</td><td>${f.phone || '-'}</td><td>${f.message}</td><td>${new Date(f.created_at*1000).toLocaleDateString()}</td></tr>`).join('');
            }
        }
        async function loadStats() {
            const data = await authFetch('/api/admin/stats');
            if (data.success) {
                document.getElementById('stats-content').innerHTML = `
                    <p>کل آگهی‌ها: ${data.totalAds}</p><p>تایید شده: ${data.approvedAds}</p><p>در انتظار: ${data.pendingAds}</p>
                    <p>ویژه: ${data.specialAds}</p><p>بازدید کل: ${data.totalViews}</p><p>بازدید امروز: ${data.todayViews}</p><p>بازخوردها: ${data.feedbackCount}</p>`;
            }
        }

        // تب‌های مدیریت
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.admin-tab-content').forEach(c => c.style.display = 'none');
                document.getElementById(`admin-${tab.dataset.tab}`).style.display = 'block';
            });
        });

        // ==================== ناوبری ====================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === pageId);
            });
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                if (page === 'home') showPage('home');
                else if (page === 'submit') showPage('submit');
                else if (page === 'admin') showPage('admin');
            });
        });

        document.getElementById('home-link').addEventListener('click', (e) => { e.preventDefault(); showPage('home'); });
        document.getElementById('submit-link').addEventListener('click', (e) => { e.preventDefault(); showPage('submit'); });
        document.getElementById('admin-toggle').addEventListener('click', (e) => { e.preventDefault(); showPage('admin'); });

        document.getElementById('search-btn').addEventListener('click', loadAds);
        document.getElementById('search-input').addEventListener('keyup', (e) => { if (e.key === 'Enter') loadAds(); });

        // تغییر زبان
        function setLang(lang) {
            currentLang = lang; localStorage.setItem('lang', lang);
            updateUILang(); loadAds();
        }
        document.getElementById('lang-fa').addEventListener('click', () => setLang('fa'));
        document.getElementById('lang-ar').addEventListener('click', () => setLang('ar'));
        document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

        // بستن مودال
        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('ad-modal').classList.remove('active');
        });

        // پر کردن dropdown دسته‌ها در صفحه ثبت
        function populateCategoryDropdowns() {
            const mainSelect = document.getElementById('main-category');
            mainSelect.innerHTML = '<option value="">انتخاب کنید</option>' + 
                categories.filter(c => !c.parent_id).map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
            mainSelect.addEventListener('change', function() {
                const id = parseInt(this.value);
                const subSelect = document.getElementById('sub-category');
                if (!id) { subSelect.innerHTML = '<option value="">بدون زیرمجموعه</option>'; return; }
                const subs = categories.filter(c => c.parent_id === id);
                subSelect.innerHTML = '<option value="">بدون زیرمجموعه</option>' + subs.map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
            });
        }

        // شروع
        loadCategories();
        loadAds();
        updateUILang();
        if (adminToken) {
            document.getElementById('admin-login-section').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadAdminData();
        }
        populateCategoryDropdowns();

        // اضافه کردن مقادیر ساختگی برای کیف پول (دکوری)
        document.getElementById('walletBalance').innerText = '۱,۲۵۰,۰۰۰';
        document.getElementById('userPoints').innerText = '۳۲۰';
    </script>
</body>
    </html>
